[tools]
go = "1.26.6"
node = "24"
pnpm = "10.12.1"
golangci-lint = "2.12.2"

[tasks.dev]
description = "Run the normal Music Server and Web Client development environment"
depends = ["web:dev"]
run = ":"

[tasks."web:dev"]
description = "Run the Music Server and Web Client in development mode"
run = "./scripts/run-with-music-server.sh development pnpm --dir web dev"

[tasks."desktop:dev"]
description = "Run the Music Server and Desktop Client in development mode"
run = "./scripts/run-with-music-server.sh development pnpm --dir desktop desktop:dev"

[tasks.build]
description = "Build the Web Client, Music Server, and Desktop Client"
depends = ["server:build", "desktop:build"]
run = ":"

[tasks."server:build"]
description = "Build the Music Server binary with embedded Web Client assets"
depends = ["web:build", "docs:build"]
run = """
#!/usr/bin/env bash
set -euo pipefail
chmod +x scripts/sync-static.sh
./scripts/sync-static.sh
cd server
go build -o ../bin/server ./cmd/server
"""

[tasks."desktop:build"]
description = "Build the release Desktop Client with pinned mpv"
depends = ["web:build"]
run = "pnpm --filter @repo/desktop build:sidecar:prepared"

[tasks.start]
description = "Run the built Music Server and release Desktop Client"
run = """
#!/usr/bin/env bash
set -euo pipefail
[[ -x bin/server ]] || { echo "Missing bin/server; run 'mise run build' first." >&2; exit 1; }
[[ -x desktop/src-tauri/target/release/earthly-audio-desktop ]] || { echo "Missing Desktop Client; run 'mise run build' first." >&2; exit 1; }
./scripts/run-with-music-server.sh built pnpm --dir desktop start
"""

[tasks.generate]
description = "Regenerate committed OpenAPI clients"
run = "bash scripts/generate-openapi.sh"

[tasks."generate:check"]
description = "Verify committed OpenAPI clients are current"
run = "bash scripts/check-openapi-generation.sh"

[tasks.format]
description = "Format the workspace, Music Server, and Desktop Client"
depends = ["workspace:format", "server:format", "desktop:format"]
run = ":"

[tasks."format:check"]
description = "Verify formatting across the workspace, Music Server, and Desktop Client"
depends = ["workspace:format:check", "server:format:check", "desktop:format:check"]
run = ":"

[tasks.lint]
description = "Lint the workspace, Music Server, and Desktop Client"
depends = ["workspace:lint", "server:lint", "desktop:lint"]
run = ":"

[tasks.typecheck]
description = "Type-check the TypeScript workspace"
depends = ["workspace:typecheck"]
run = ":"

[tasks.check]
description = "Run static checks across the workspace, Music Server, and Desktop Client"
depends = ["workspace:check", "workspace:typecheck", "server:check", "desktop:check"]
run = ":"

[tasks.test]
description = "Run workspace, Music Server, Desktop Client, and Git hook tests"
depends = ["workspace:test", "server:test", "desktop:test", "git-hooks:test"]
run = ":"

[tasks."git-hooks:test"]
description = "Test repository-managed Git hook behavior"
run = "node --test scripts/test-git-hooks.mjs"

[tasks."workspace:build"]
description = "Build workspace production artifacts"
run = "bash scripts/run-workspace-task.sh build web"

[tasks."workspace:format"]
description = "Format the Web Client, shared UI, and API client"
run = "bash scripts/run-workspace-task.sh format web @repo/ui @repo/api-client"

[tasks."workspace:format:check"]
description = "Verify formatting for the Web Client, shared UI, and API client"
run = "bash scripts/run-workspace-task.sh format:check web @repo/ui @repo/api-client"

[tasks."workspace:lint"]
description = "Lint the Web Client, shared UI, and API client"
run = "bash scripts/run-workspace-task.sh lint web @repo/ui @repo/api-client"

[tasks."workspace:check"]
description = "Check the Web Client, shared UI, and API client"
run = "bash scripts/run-workspace-task.sh check web @repo/ui @repo/api-client"

[tasks."workspace:typecheck"]
description = "Type-check the Web Client, shared UI, and API client"
run = "bash scripts/run-workspace-task.sh typecheck web @repo/ui @repo/api-client"

[tasks."workspace:test"]
description = "Run Web Client, shared UI, and API client unit tests"
run = "bash scripts/run-workspace-task.sh test:unit web @repo/ui @repo/api-client"

[tasks."web:build"]
description = "Build the Web Client"
depends = ["workspace:build"]
run = ":"

[tasks."docs:build"]
description = "Build the product documentation embedded by the Music Server"
run = "pnpm turbo run build --filter=@repo/docs"

[tasks."web:format"]
description = "Format the Web Client"
run = "bash scripts/run-workspace-task.sh format web"

[tasks."web:check"]
description = "Check the Web Client"
run = "bash scripts/run-workspace-task.sh check web"

[tasks."web:typecheck"]
description = "Type-check the Web Client"
run = "bash scripts/run-workspace-task.sh typecheck web"

[tasks."web:test"]
description = "Run Web Client unit tests"
run = "bash scripts/run-workspace-task.sh test:unit web"

[tasks."ui:format"]
description = "Format the shared UI"
run = "bash scripts/run-workspace-task.sh format @repo/ui"

[tasks."ui:check"]
description = "Check the shared UI"
run = "bash scripts/run-workspace-task.sh check @repo/ui"

[tasks."ui:typecheck"]
description = "Type-check the shared UI"
run = "bash scripts/run-workspace-task.sh typecheck @repo/ui"

[tasks."ui:test"]
description = "Run shared UI unit tests"
run = "bash scripts/run-workspace-task.sh test:unit @repo/ui"

[tasks."api-client:format"]
description = "Format the API client"
run = "bash scripts/run-workspace-task.sh format @repo/api-client"

[tasks."api-client:check"]
description = "Check the API client"
run = "bash scripts/run-workspace-task.sh check @repo/api-client"

[tasks."api-client:typecheck"]
description = "Type-check the API client"
run = "bash scripts/run-workspace-task.sh typecheck @repo/api-client"

[tasks."api-client:test"]
description = "Run API client unit tests"
run = "bash scripts/run-workspace-task.sh test:unit @repo/api-client"

[tasks."server:format"]
description = "Format the Music Server"
run = "cd server && go fmt ./..."

[tasks."server:format:check"]
description = "Verify Music Server formatting"
run = """
#!/usr/bin/env bash
set -euo pipefail
cd server
unformattedFiles="$(gofmt -l .)"
if [[ -n "$unformattedFiles" ]]; then
  printf '%s\n' "$unformattedFiles" >&2
  exit 1
fi
"""

[tasks."server:lint"]
description = "Lint the Music Server"
run = "cd server && golangci-lint run"

[tasks."server:check"]
description = "Check Music Server formatting and lint"
depends = ["server:format:check", "server:lint"]
run = ":"

[tasks."server:test"]
description = "Run Music Server unit tests"
run = "cd server && go test ./..."

[tasks."desktop:format"]
description = "Format the Desktop Client"
run = "pnpm --filter @repo/desktop format"

[tasks."desktop:format:check"]
description = "Verify Desktop Client formatting"
run = "pnpm --filter @repo/desktop format:check"

[tasks."desktop:lint"]
description = "Lint the Desktop Client with Clippy"
run = "pnpm --filter @repo/desktop lint"

[tasks."desktop:check"]
description = "Check Desktop Client formatting and Clippy"
depends = ["desktop:format:check", "desktop:lint"]
run = ":"

[tasks."desktop:test"]
description = "Run Desktop Client unit tests"
run = "pnpm --filter @repo/desktop test:unit"

[tasks."web:test:e2e"]
description = "Run Web Client Playwright tests"
run = "pnpm turbo run test:e2e --filter=web"

[tasks."server:test:hls"]
description = "Run Music Server HLS browser integration tests"
run = "cd server && RUN_HLS_BROWSER_INTEGRATION=1 go test ./internal/modules/radio -run TestBrowserHLSProxyIntegration -count=1 -v"

[tasks."desktop:test:mpv"]
description = "Run Desktop Client tests against pinned mpv"
run = "pnpm --filter @repo/desktop prepare:mpv && pnpm --filter @repo/desktop test:mpv"

[tasks."ci:fast"]
description = "Run the local fast CI policy"
depends = ["check", "test"]
run = ":"

[tasks."ci:integration"]
description = "Run all browser, HLS, and pinned-mpv integration tests"
depends = ["web:test:e2e", "server:test:hls", "desktop:test:mpv"]
run = ":"

[tasks."ci:full"]
description = "Run full local CI policy and production builds"
depends = ["ci:fast"]
run = """
#!/usr/bin/env bash
set -euo pipefail
mise run generate:check
mise run ci:integration
mise run build
"""
