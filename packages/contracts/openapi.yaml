openapi: 3.0.3
info:
  title: Navidrome Replacement API
  version: 0.1.0
  description: Self-hosted music server API
servers:
  - url: http://localhost:8090
    description: Local development
tags:
  - name: system
  - name: user
  - name: preferences
  - name: library
  - name: imports
  - name: playback
  - name: playlists
  - name: radio
paths:
  /api/v1/health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Health check
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/me:
    get:
      tags: [user]
      operationId: getMe
      summary: Current user profile (stub)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/preferences:
    get:
      tags: [preferences]
      operationId: getPreferences
      summary: Get user preferences including layout
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreferences"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [preferences]
      operationId: patchPreferences
      summary: Update user preferences
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserPreferencesPatch"
      responses:
        "200":
          description: Updated preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreferences"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/library/scan:
    post:
      tags: [library]
      operationId: triggerLibraryScan
      summary: Deprecated legacy scan trigger (retired)
      deprecated: true
      description: >-
        Legacy server-side library scanning is retired. Managed Import is the
        authoritative ingestion path and Legacy Tracks change only through an
        explicit Library Migration. This route stays mounted for API v1
        compatibility and always answers 410 with error code
        legacy_scan_retired; it never discovers or ingests files. New clients
        must not call it.
      responses:
        "410":
          $ref: "#/components/responses/Gone"
  /api/v1/library/scan/status:
    get:
      tags: [library]
      operationId: getLibraryScanStatus
      summary: Deprecated legacy scan status (always idle)
      deprecated: true
      description: >-
        Retained for API v1 compatibility so older clients that poll after a
        scan trigger stop gracefully. The scanner never runs, so the status is
        permanently idle with zero counts. New clients must not call it.
      responses:
        "200":
          description: Permanently idle scan status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanStatus"
  /api/v1/library/artists:
    get:
      tags: [library]
      operationId: listArtists
      summary: List artists
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - name: q
          in: query
          schema:
            type: string
          description: Search by name
      responses:
        "200":
          description: Artist list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtistList"
  /api/v1/library/albums:
    get:
      tags: [library]
      operationId: listAlbums
      summary: List albums
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - name: artistId
          in: query
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          schema:
            type: string
          description: Search by title
      responses:
        "200":
          description: Album list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlbumList"
  /api/v1/library/albums/{albumId}:
    get:
      tags: [library]
      operationId: getAlbum
      summary: Get album with tracks
      parameters:
        - $ref: "#/components/parameters/albumId"
      responses:
        "200":
          description: Album detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlbumDetail"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [library]
      operationId: deleteAlbum
      summary: Delete album, its tracks, and music files
      parameters:
        - $ref: "#/components/parameters/albumId"
      responses:
        "200":
          description: Album deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/library/albums/{albumId}/cover:
    get:
      tags: [library]
      operationId: getAlbumCover
      summary: Get album cover image
      parameters:
        - $ref: "#/components/parameters/albumId"
      responses:
        "200":
          description: Cover image
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/library/tracks:
    get:
      tags: [library]
      operationId: listTracks
      summary: List or search tracks
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - name: q
          in: query
          schema:
            type: string
          description: Search by title or artist
      responses:
        "200":
          description: Track list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackList"
  /api/v1/library/tracks/{trackId}:
    get:
      tags: [library]
      operationId: getTrack
      summary: Get track metadata
      parameters:
        - $ref: "#/components/parameters/trackId"
      responses:
        "200":
          description: Track metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Track"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [library]
      operationId: deleteTrack
      summary: Permanently delete a Managed Track after reviewing its deletion preview
      parameters:
        - $ref: "#/components/parameters/trackId"
        - name: X-Permanent-Delete
          in: header
          required: true
          description: Explicit application confirmation required for irreversible deletion
          schema:
            type: string
            enum: ["1"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrackDeletionConfirmation"
      responses:
        "200":
          description: Managed Track and its exact managed audio file permanently deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/library/tracks/{trackId}/deletion:
    get:
      tags: [library]
      operationId: previewTrackDeletion
      summary: Review irreversible Managed Track deletion and all affected references
      parameters:
        - $ref: "#/components/parameters/trackId"
      responses:
        "200":
          description: Current Permanent Track Deletion preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackDeletionPreview"
        "409":
          $ref: "#/components/responses/Conflict"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/library/tracks/{trackId}/replacement:
    post:
      tags: [library]
      operationId: createTrackReplacement
      summary: Start an explicit Track Replacement for one Managed Track
      description: >-
        Creates a Managed Import Job bound to the Track. Upload the replacement file
        with uploadManagedImportFile; the returned Import Preview carries a
        replacement section listing every difference and destructive consequence.
        Confirm with confirmTrackReplacement, never with confirmManagedImport.
      parameters:
        - $ref: "#/components/parameters/trackId"
      responses:
        "201":
          description: Track Replacement job created and awaiting the replacement upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedImportJob"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/library-migrations/preview:
    post:
      tags: [imports]
      operationId: previewLibraryMigration
      summary: Analyze every Legacy Track through the Strict Import Profile without changing library state
      parameters:
        - name: X-Migration-Preview
          in: header
          required: true
          description: Non-simple application header required to prevent cross-origin form submissions
          schema:
            type: string
            enum: ["1"]
      responses:
        "200":
          description: Stable accepted and rejected Library Migration preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryMigrationPreview"
        "409":
          $ref: "#/components/responses/Conflict"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/library-migrations/stage:
    post:
      tags: [imports]
      operationId: stageLibraryMigration
      summary: Copy and verify accepted Legacy Tracks in hidden pending Managed Storage locations
      parameters:
        - name: X-Migration-Stage
          in: header
          required: true
          description: Non-simple application header required to confirm explicit migration staging
          schema:
            type: string
            enum: ["1"]
      responses:
        "200":
          description: Per-file result of staging and verifying the current Library Migration candidates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryMigrationStage"
        "409":
          $ref: "#/components/responses/Conflict"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/library-migrations/cutover:
    post:
      tags: [imports]
      operationId: cutoverLibraryMigration
      summary: Activate verified migration copies as Managed Tracks and remove the migrated Legacy Tracks
      description: >-
        Re-runs the migration preview and staging, then activates every verified
        copy under a new stable Track ID. The corresponding Legacy Track is removed
        only after managed activation succeeds, and its old Playlist, Queue, and
        snapshot references are dropped rather than remapped. The final report
        distinguishes migrated, rejected, failed, and not-attempted files.
      parameters:
        - name: X-Migration-Cutover
          in: header
          required: true
          description: Non-simple application header required to confirm explicit migration cutover
          schema:
            type: string
            enum: ["1"]
      responses:
        "200":
          description: Per-file result of cutting over the verified Library Migration copies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryMigrationCutover"
        "409":
          $ref: "#/components/responses/Conflict"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/library-migrations/cleanup:
    get:
      tags: [imports]
      operationId: previewLibraryMigrationCleanup
      summary: List legacy source files eligible for cleanup after a verified migration
      description: >-
        Lists every legacy source file. Only sources proven to correspond to an
        active migrated Managed Track (recorded by a completed cutover, with the
        managed bytes and the source bytes still hashing to the migrated
        content) are eligible. Rejected, failed, pending, unverified, changed,
        or unsafe sources are reported as ineligible and can never be selected.
        The preview reports the exact eligible file count and total size and
        changes nothing.
      responses:
        "200":
          description: Legacy source cleanup preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryMigrationCleanupPreview"
        "409":
          $ref: "#/components/responses/Conflict"
    post:
      tags: [imports]
      operationId: cleanupLibraryMigrationSources
      summary: Irreversibly delete the confirmed legacy source files of migrated Managed Tracks
      description: >-
        Deletes exactly the legacy source files named by the selected Managed
        Track IDs. Every target is resolved and verified again before any file
        is removed; if the selection, the confirmed file count, or the confirmed
        total size no longer match the eligible set, nothing is deleted and the
        request is rejected with a conflict. Empty parent directories are pruned
        upward to the configured music path without recursing into siblings.
        Migration success never triggers this cleanup automatically.
      parameters:
        - name: X-Migration-Cleanup
          in: header
          required: true
          description: Explicit application confirmation required for irreversible legacy source deletion
          schema:
            type: string
            enum: ["1"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LibraryMigrationCleanupConfirmation"
      responses:
        "200":
          description: Per-file result of deleting the confirmed legacy source files
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryMigrationCleanup"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/import-batches:
    post:
      tags: [imports]
      operationId: createManagedImportBatch
      summary: Create one multi-file Managed Import Batch
      responses:
        "201":
          description: Managed Import Batch created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedImportBatch"
  /api/v1/import-history:
    get:
      tags: [imports]
      operationId: listImportHistory
      summary: List up to 20 most recent terminal Managed Import results
      responses:
        "200":
          description: Recent terminal Import History without staged audio or raw metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedImportHistoryList"
  /api/v1/import-batches/{batchId}:
    get:
      tags: [imports]
      operationId: getManagedImportBatch
      summary: Get per-file preview, progress, selection, and outcomes
      parameters:
        - $ref: "#/components/parameters/batchId"
      responses:
        "200":
          description: Current Managed Import Batch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedImportBatch"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [imports]
      operationId: cancelManagedImportBatch
      summary: Cancel an uncommitted Managed Import Batch and remove its staging
      parameters:
        - $ref: "#/components/parameters/batchId"
      responses:
        "204":
          description: Managed Import Batch canceled and staging removed
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/import-batches/{batchId}/confirm:
    post:
      tags: [imports]
      operationId: confirmManagedImportBatch
      summary: Commit selected accepted files independently and return all outcomes
      parameters:
        - $ref: "#/components/parameters/batchId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagedImportBatchConfirmation"
      responses:
        "200":
          description: Terminal per-file Import Batch report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedImportBatch"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/imports:
    post:
      tags: [imports]
      operationId: createManagedImportJob
      summary: Create one server-owned Managed Import Job
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagedImportJobCreate"
      responses:
        "201":
          description: Managed Import Job created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedImportJob"
  /api/v1/imports/{importId}:
    get:
      tags: [imports]
      operationId: getManagedImportJob
      summary: Observe Managed Import validation progress and terminal result
      parameters:
        - $ref: "#/components/parameters/importId"
      responses:
        "200":
          description: Current Managed Import Job result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedImportJob"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [imports]
      operationId: cancelManagedImport
      summary: Cancel an uncommitted Managed Import Job and remove its staging
      parameters:
        - $ref: "#/components/parameters/importId"
      responses:
        "204":
          description: Managed Import Job canceled and staging removed
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/imports/{importId}/file:
    put:
      tags: [imports]
      operationId: uploadManagedImportFile
      summary: Stream one audio file into a Managed Import Job and detect its actual format
      parameters:
        - $ref: "#/components/parameters/importId"
        - name: X-Import-Filename
          in: header
          required: true
          schema:
            type: string
          description: Display-only client filename; never used as a storage path.
        - name: X-Import-Filename-Encoding
          in: header
          required: false
          schema:
            type: string
            enum: [url]
          description: >-
            Set to url when X-Import-Filename is percent-encoded so non-ASCII
            filenames survive HTTP header transport. Absent means the header is
            sent verbatim.
      description: >-
        The request media type is advisory only. The Music Server detects the
        Source Audio Format from the uploaded bytes and never trusts the
        declared Content-Type or the client filename extension.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
          audio/flac:
            schema:
              type: string
              format: binary
          audio/wav:
            schema:
              type: string
              format: binary
          audio/mpeg:
            schema:
              type: string
              format: binary
          audio/mp4:
            schema:
              type: string
              format: binary
          audio/ogg:
            schema:
              type: string
              format: binary
          audio/opus:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Import Preview ready for confirmation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedImportPreview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "408":
          description: Upload stream was interrupted and this Import Job remains retryable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          description: File or batch exceeds the configured Managed Import byte limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: File fails the Strict Import Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "507":
          $ref: "#/components/responses/InsufficientStorage"
  /api/v1/imports/{importId}/confirm:
    post:
      tags: [imports]
      operationId: confirmManagedImport
      summary: Confirm an Import Preview and commit its Managed Track
      parameters:
        - $ref: "#/components/parameters/importId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagedImportConfirmation"
      responses:
        "200":
          description: Managed Track committed, or the idempotent prior result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedImportResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "507":
          $ref: "#/components/responses/InsufficientStorage"
  /api/v1/imports/{importId}/replacement:
    post:
      tags: [imports]
      operationId: confirmTrackReplacement
      summary: Confirm a reviewed Track Replacement and delete the previous managed file
      description: >-
        Keeps the Track ID and every Playlist and Queue reference, makes the validated
        replacement metadata authoritative, cleans emptied Albums and Artists, and
        deletes the previous managed file only after the replacement was placed,
        hashed, committed, and read back from its Canonical Library Path.
      parameters:
        - $ref: "#/components/parameters/importId"
        - name: X-Track-Replacement
          in: header
          required: true
          description: Explicit application confirmation required for the irreversible old-file deletion
          schema:
            type: string
            enum: ["1"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrackReplacementConfirmation"
      responses:
        "200":
          description: Track Replacement committed, or the idempotent prior result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackReplacementResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          description: Replacement file no longer passes the Strict Import Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "507":
          $ref: "#/components/responses/InsufficientStorage"
  /api/v1/playback/queue:
    get:
      tags: [playback]
      operationId: getPlaybackQueue
      summary: Get playback queue
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Queue"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [playback]
      operationId: replacePlaybackQueue
      summary: Replace playback queue
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueueReplace"
      responses:
        "200":
          description: Updated queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Queue"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Queue revision conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueConflictResponse"
    patch:
      tags: [playback]
      operationId: reorderPlaybackQueue
      summary: Reorder playback queue items
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueueReorder"
      responses:
        "200":
          description: Updated queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Queue"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Queue revision conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueConflictResponse"
  /api/v1/playback/queue/items:
    post:
      tags: [playback]
      operationId: appendPlaybackQueueItem
      summary: Append track to queue
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueueItemAppend"
      responses:
        "200":
          description: Updated queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Queue"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Queue revision conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueConflictResponse"
  /api/v1/playback/queue/items/{itemId}:
    delete:
      tags: [playback]
      operationId: removePlaybackQueueItem
      summary: Remove item from queue
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/queueItemId"
        - name: If-Match
          in: header
          required: true
          description: Queue Revision on which removal intent is based
          schema:
            type: string
      responses:
        "200":
          description: Updated queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Queue"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Queue revision conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueConflictResponse"
  /api/v1/playback/queue/events:
    get:
      tags: [playback]
      operationId: streamPlaybackQueueEvents
      summary: Stream Queue invalidation events
      description: >-
        Emits queue-invalidated server-sent events. Event IDs carry the persisted
        event sequence, while data carries that sequence and the latest Queue
        Revision so reconnecting clients can detect stale state and refetch the
        Queue.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Queue event stream
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/QueueEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/tracks/{trackId}/stream:
    get:
      tags: [playback]
      operationId: streamTrack
      summary: Stream track audio with HTTP Range support
      parameters:
        - $ref: "#/components/parameters/trackId"
      responses:
        "200":
          description: Full audio stream
          content:
            audio/*:
              schema:
                type: string
                format: binary
        "206":
          description: Partial content (Range request)
          content:
            audio/*:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
        "416":
          $ref: "#/components/responses/RangeNotSatisfiable"
  /api/v1/playlists:
