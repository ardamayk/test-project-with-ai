                type: string
                format: binary
            application/vnd.apple.mpegurl:
              schema:
                type: string
                format: binary
            application/x-mpegurl:
              schema:
                type: string
                format: binary
            video/*:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: Partial HLS media resource
          content:
            audio/*:
              schema:
                type: string
                format: binary
            video/*:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "415":
          description: DRM-protected HLS is unsupported
        "502":
          description: Upstream radio resource failed
  /api/v1/radio/stations/{stationId}/stream:
    get:
      tags: [radio]
