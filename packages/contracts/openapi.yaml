openapi: 3.0.3
info:
  title: Navidrome Replacement API
  version: 0.1.0
  description: Self-hosted music server API
servers:
  - url: http://localhost:8090
    description: Local development
tags:
  - name: system
  - name: user
  - name: preferences
  - name: library
  - name: imports
  - name: playback
  - name: playlists
  - name: radio
paths:
  /api/v1/health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Health check
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/me:
    get:
      tags: [user]
      operationId: getMe
      summary: Current user profile (stub)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/preferences:
    get:
      tags: [preferences]
      operationId: getPreferences
      summary: Get user preferences including layout
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreferences"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [preferences]
      operationId: patchPreferences
      summary: Update user preferences
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserPreferencesPatch"
      responses:
        "200":
          description: Updated preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreferences"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/library/scan:
    post:
      tags: [library]
      operationId: triggerLibraryScan
      summary: Trigger library scan
      responses:
        "202":
          description: Scan started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanStatus"
        "409":
          $ref: "#/components/responses/Conflict"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/library/scan/status:
    get:
      tags: [library]
      operationId: getLibraryScanStatus
      summary: Get current or latest scan status
      responses:
        "200":
          description: Scan status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanStatus"
  /api/v1/library/artists:
    get:
      tags: [library]
      operationId: listArtists
      summary: List artists
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - name: q
          in: query
          schema:
            type: string
          description: Search by name
      responses:
        "200":
          description: Artist list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtistList"
  /api/v1/library/albums:
    get:
      tags: [library]
      operationId: listAlbums
      summary: List albums
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - name: artistId
          in: query
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          schema:
            type: string
          description: Search by title
      responses:
        "200":
          description: Album list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlbumList"
  /api/v1/library/albums/{albumId}:
    get:
      tags: [library]
      operationId: getAlbum
      summary: Get album with tracks
      parameters:
        - $ref: "#/components/parameters/albumId"
      responses:
        "200":
          description: Album detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlbumDetail"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [library]
      operationId: deleteAlbum
      summary: Delete album, its tracks, and music files
      parameters:
        - $ref: "#/components/parameters/albumId"
      responses:
        "200":
          description: Album deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/library/albums/{albumId}/cover:
    get:
      tags: [library]
      operationId: getAlbumCover
      summary: Get album cover image
      parameters:
        - $ref: "#/components/parameters/albumId"
      responses:
        "200":
          description: Cover image
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/library/tracks:
    get:
      tags: [library]
      operationId: listTracks
      summary: List or search tracks
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - name: q
          in: query
          schema:
            type: string
          description: Search by title or artist
      responses:
        "200":
          description: Track list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackList"
  /api/v1/library/tracks/{trackId}:
    get:
      tags: [library]
      operationId: getTrack
      summary: Get track metadata
      parameters:
        - $ref: "#/components/parameters/trackId"
      responses:
        "200":
          description: Track metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Track"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [library]
      operationId: deleteTrack
      summary: Delete track and its music file
      parameters:
        - $ref: "#/components/parameters/trackId"
      responses:
        "200":
          description: Track deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/import-batches:
    post:
      tags: [imports]
      operationId: createManagedImportBatch
      summary: Create one multi-file Managed Import Batch
      responses:
        "201":
          description: Managed Import Batch created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedImportBatch"
  /api/v1/import-batches/{batchId}:
    get:
      tags: [imports]
      operationId: getManagedImportBatch
      summary: Get per-file preview, progress, selection, and outcomes
      parameters:
        - $ref: "#/components/parameters/batchId"
      responses:
        "200":
          description: Current Managed Import Batch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedImportBatch"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/import-batches/{batchId}/confirm:
    post:
      tags: [imports]
      operationId: confirmManagedImportBatch
      summary: Commit selected accepted files independently and return all outcomes
      parameters:
        - $ref: "#/components/parameters/batchId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagedImportBatchConfirmation"
      responses:
        "200":
          description: Terminal per-file Import Batch report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedImportBatch"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/imports:
    post:
      tags: [imports]
      operationId: createManagedImportJob
      summary: Create one server-owned Managed Import Job
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagedImportJobCreate"
      responses:
        "201":
          description: Managed Import Job created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedImportJob"
  /api/v1/imports/{importId}:
    get:
      tags: [imports]
      operationId: getManagedImportJob
      summary: Observe Managed Import validation progress and terminal result
      parameters:
        - $ref: "#/components/parameters/importId"
      responses:
        "200":
          description: Current Managed Import Job result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedImportJob"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/imports/{importId}/file:
    put:
      tags: [imports]
      operationId: uploadManagedImportFile
      summary: Stream one audio file into a Managed Import Job and detect its actual format
      parameters:
        - $ref: "#/components/parameters/importId"
        - name: X-Import-Filename
          in: header
          required: true
          schema:
            type: string
          description: Display-only client filename; never used as a storage path.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
          audio/flac:
            schema:
              type: string
              format: binary
          audio/wav:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Import Preview ready for confirmation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedImportPreview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "408":
          description: Upload stream was interrupted and this Import Job remains retryable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          description: File or batch exceeds the configured Managed Import byte limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: File fails the Strict Import Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "507":
          $ref: "#/components/responses/InsufficientStorage"
  /api/v1/imports/{importId}/confirm:
    post:
      tags: [imports]
      operationId: confirmManagedImport
      summary: Confirm an Import Preview and commit its Managed Track
      parameters:
        - $ref: "#/components/parameters/importId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagedImportConfirmation"
      responses:
        "200":
          description: Managed Track committed, or the idempotent prior result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedImportResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "507":
          $ref: "#/components/responses/InsufficientStorage"
  /api/v1/playback/queue:
    get:
      tags: [playback]
      operationId: getPlaybackQueue
      summary: Get playback queue
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Queue"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [playback]
      operationId: replacePlaybackQueue
      summary: Replace playback queue
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueueReplace"
      responses:
        "200":
          description: Updated queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Queue"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Queue revision conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueConflictResponse"
    patch:
      tags: [playback]
      operationId: reorderPlaybackQueue
      summary: Reorder playback queue items
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueueReorder"
      responses:
        "200":
          description: Updated queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Queue"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Queue revision conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueConflictResponse"
  /api/v1/playback/queue/items:
    post:
      tags: [playback]
      operationId: appendPlaybackQueueItem
      summary: Append track to queue
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueueItemAppend"
      responses:
        "200":
          description: Updated queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Queue"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Queue revision conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueConflictResponse"
  /api/v1/playback/queue/items/{itemId}:
    delete:
      tags: [playback]
      operationId: removePlaybackQueueItem
      summary: Remove item from queue
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/queueItemId"
        - name: If-Match
          in: header
          required: true
          description: Queue Revision on which removal intent is based
          schema:
            type: string
      responses:
        "200":
          description: Updated queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Queue"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Queue revision conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueConflictResponse"
  /api/v1/playback/queue/events:
    get:
      tags: [playback]
      operationId: streamPlaybackQueueEvents
      summary: Stream Queue invalidation events
      description: >-
        Emits queue-invalidated server-sent events. Event IDs carry the persisted
        event sequence, while data carries that sequence and the latest Queue
        Revision so reconnecting clients can detect stale state and refetch the
        Queue.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Queue event stream
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/QueueEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/tracks/{trackId}/stream:
    get:
      tags: [playback]
      operationId: streamTrack
      summary: Stream track audio with HTTP Range support
      parameters:
        - $ref: "#/components/parameters/trackId"
      responses:
        "200":
          description: Full audio stream
          content:
            audio/*:
              schema:
                type: string
                format: binary
        "206":
          description: Partial content (Range request)
          content:
            audio/*:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
        "416":
          $ref: "#/components/responses/RangeNotSatisfiable"
  /api/v1/playlists:
    get:
      tags: [playlists]
      operationId: listPlaylists
      summary: List playlists
      responses:
        "200":
          description: Playlist list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaylistList"
    post:
      tags: [playlists]
      operationId: createPlaylist
      summary: Create playlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaylistCreate"
      responses:
        "201":
          description: Created playlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Playlist"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/playlists/{playlistId}:
    get:
      tags: [playlists]
      operationId: getPlaylist
      summary: Get playlist with tracks
      parameters:
        - $ref: "#/components/parameters/playlistId"
      responses:
        "200":
          description: Playlist detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaylistDetail"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/playlists/{playlistId}/tracks:
    post:
      tags: [playlists]
      operationId: addPlaylistTrack
      summary: Add track to playlist
      parameters:
        - $ref: "#/components/parameters/playlistId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaylistTrackAdd"
      responses:
        "200":
          description: Updated playlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaylistDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/playlists/{playlistId}/tracks/{trackId}:
    delete:
      tags: [playlists]
      operationId: removePlaylistTrack
      summary: Remove track from playlist
      parameters:
        - $ref: "#/components/parameters/playlistId"
        - $ref: "#/components/parameters/trackId"
      responses:
        "200":
          description: Updated playlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaylistDetail"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/radio/stations:
    get:
      tags: [radio]
      operationId: listRadioStations
      summary: List user radio stations
      responses:
        "200":
          description: Radio station list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RadioStationList"
    post:
      tags: [radio]
      operationId: createRadioStation
      summary: Create user radio station
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RadioStationCreate"
      responses:
        "201":
          description: Created radio station
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RadioStation"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/radio/stations/{stationId}:
    get:
      tags: [radio]
      operationId: getRadioStation
      summary: Get user radio station
      parameters:
        - $ref: "#/components/parameters/stationId"
      responses:
        "200":
          description: Radio station detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RadioStation"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [radio]
      operationId: patchRadioStation
      summary: Update user radio station
      parameters:
        - $ref: "#/components/parameters/stationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RadioStationPatch"
      responses:
        "200":
          description: Updated radio station
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RadioStation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [radio]
      operationId: deleteRadioStation
      summary: Delete user radio station
      parameters:
        - $ref: "#/components/parameters/stationId"
      responses:
        "204":
          description: Radio station deleted
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/radio/search:
    get:
      tags: [radio]
      operationId: searchRadioStations
      summary: Search Radio Browser stations
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: country
          in: query
          schema:
            type: string
        - name: language
          in: query
          schema:
            type: string
        - name: tag
          in: query
          schema:
            type: string
        - name: codec
          in: query
          schema:
            type: string
        - name: codecGroup
          in: query
          schema:
            type: string
            enum: [aac]
        - name: minBitrate
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Radio search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RadioSearchResultList"
  /api/v1/radio/catalog/countries:
    get:
      tags: [radio]
      operationId: listRadioCatalogCountries
      summary: List Radio Browser catalog countries
      responses:
        "200":
          description: Radio Browser country options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RadioCatalogOptionList"
  /api/v1/radio/catalog/tags:
    get:
      tags: [radio]
      operationId: listRadioCatalogTags
      summary: List Radio Browser catalog tags
      responses:
        "200":
          description: Radio Browser tag options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RadioCatalogOptionList"
  /api/v1/radio/import:
    post:
      tags: [radio]
      operationId: importRadioStation
      summary: Import Radio Browser station
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RadioImportRequest"
      responses:
        "201":
          description: Imported radio station
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RadioStation"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/radio/preview/{stationUuid}/stream:
    get:
      tags: [radio]
      operationId: streamRadioPreview
      summary: Stream Radio Browser station preview
      parameters:
        - name: stationUuid
          in: path
          required: true
          schema:
            type: string
        - name: resource
          in: query
          description: Signed HLS resource token emitted by a proxied playlist
          schema:
            type: string
      responses:
        "200":
          description: Radio preview stream
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
            audio/*:
              schema:
                type: string
                format: binary
            application/vnd.apple.mpegurl:
              schema:
                type: string
                format: binary
            application/x-mpegurl:
              schema:
                type: string
                format: binary
            video/*:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: Partial HLS media resource
          content:
            audio/*:
              schema:
                type: string
                format: binary
            video/*:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "415":
          description: DRM-protected HLS is unsupported
        "502":
          description: Upstream radio resource failed
  /api/v1/radio/stations/{stationId}/stream:
    get:
      tags: [radio]
      operationId: streamRadioStation
      summary: Stream radio station through backend proxy
      parameters:
        - $ref: "#/components/parameters/stationId"
        - name: resource
          in: query
          description: Signed HLS resource token emitted by a proxied playlist
          schema:
            type: string
      responses:
        "200":
          description: Radio stream
          content:
            audio/*:
              schema:
                type: string
                format: binary
            application/vnd.apple.mpegurl:
              schema:
                type: string
                format: binary
            application/x-mpegurl:
              schema:
                type: string
                format: binary
            video/*:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: Partial HLS media resource
          content:
            audio/*:
              schema:
                type: string
                format: binary
            video/*:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          description: DRM-protected HLS is unsupported
        "502":
          description: Upstream radio resource failed
  /api/v1/radio/stations/{stationId}/now-playing:
    get:
      tags: [radio]
      operationId: getRadioNowPlaying
      summary: Get latest radio now-playing metadata
      parameters:
        - $ref: "#/components/parameters/stationId"
      responses:
        "200":
          description: Now-playing metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RadioNowPlaying"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InsufficientStorage:
      description: Managed Storage cannot satisfy the configured reserve and temporary-space requirements
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RangeNotSatisfiable:
      description: Range not satisfiable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  parameters:
    limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 50
    offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    albumId:
      name: albumId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    trackId:
      name: trackId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    importId:
      name: importId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    batchId:
      name: batchId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    queueItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    playlistId:
      name: playlistId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    stationId:
      name: stationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    HealthResponse:
      type: object
      required: [status, version, capabilities]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
        capabilities:
          type: array
          items:
            type: string
          description: >-
            Named server behaviors supported by this release. Queue event streaming
            is advertised as playback.queue-events.v1 and the first strict FLAC
            Managed Import tracer bullet as managed-import.v1. Multi-file Managed
            Import Batches are advertised as managed-import-batches.v1.
    User:
      type: object
      required: [id, username]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
    LayoutPreferences:
      type: object
      required: [sidebarPosition, panels, collapsed]
      properties:
        sidebarPosition:
          type: string
          enum: [left, right]
        panels:
          type: object
          required: [left, right]
          properties:
            left:
              type: array
              items:
                type: string
            right:
              type: array
              items:
                type: string
        collapsed:
          type: object
          required: [left, right]
          properties:
            left:
              type: boolean
            right:
              type: boolean
        sizes:
          type: array
          items:
            type: number
          minItems: 3
          maxItems: 3
          description: Panel widths as percentages [left, main, right]
    ThemePreferences:
      type: object
      required: [mode, preset]
      properties:
        mode:
          type: string
          enum: [light, dark, system]
        preset:
          type: string
          enum:
            - earthly
            - tokyo-night
            - vintage-harbor
            - night-ember
            - dusty-earth
            - coastal-mist
            - sage-hearth
    UserPreferences:
      type: object
      required: [theme, layout]
      properties:
        theme:
          $ref: "#/components/schemas/ThemePreferences"
        layout:
          $ref: "#/components/schemas/LayoutPreferences"
    UserPreferencesPatch:
      type: object
      properties:
        theme:
          $ref: "#/components/schemas/ThemePreferences"
        layout:
          $ref: "#/components/schemas/LayoutPreferences"
    ErrorResponse:
      type: object
      required: [error, code, message]
      properties:
        error:
          type: string
        code:
          type: string
        message:
          type: string
        field:
          type: string
          description: Machine-readable field associated with a structured validation failure.
        reason:
          type: string
          description: Actionable reason for a structured validation failure.
    ManagedImportJob:
      type: object
      required: [id, status, revision, validationProgress]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [uploading, awaiting_confirmation, committed, failed]
        revision:
          type: integer
          minimum: 1
        validationProgress:
          type: integer
          minimum: 0
          maximum: 100
        errorCode:
          type: string
          description: Stable failure code when status is failed.
        trackId:
          type: string
          format: uuid
          description: Created Track when status is committed.
    ManagedImportJobCreate:
      type: object
      required: [batchId, clientFileId]
      properties:
        batchId:
          type: string
          format: uuid
          description: Import Batch that owns this per-file job.
        clientFileId:
          type: string
          format: uuid
          description: Client-generated identifier used to correlate a Batch file when the create response is lost.
    ManagedImportBatch:
      type: object
      required: [id, status, revision, files]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [uploading, confirming, completed]
        revision:
          type: integer
          minimum: 1
        files:
          type: array
          items:
            $ref: "#/components/schemas/ManagedImportBatchFile"
    ManagedImportBatchFile:
      type: object
      required: [jobId, state, status, revision, validationProgress, selected]
      properties:
        jobId:
          type: string
          format: uuid
        clientFileId:
          type: string
          format: uuid
        state:
          type: string
          enum: [accepted, rejected, unresolved, completed]
        status:
          type: string
          enum: [uploading, awaiting_confirmation, committed, failed]
        revision:
          type: integer
          minimum: 1
        validationProgress:
          type: integer
          minimum: 0
          maximum: 100
        originalFilename:
          type: string
        selected:
          type: boolean
        preview:
          $ref: "#/components/schemas/ManagedImportPreview"
        errorCode:
          type: string
        errorField:
          type: string
        errorReason:
          type: string
        outcome:
          type: string
          enum: [imported, rejected, failed, replaced, not_attempted]
        trackId:
          type: string
          format: uuid
    ManagedImportBatchConfirmation:
      type: object
      required: [revision, selectedFileIds]
      properties:
        revision:
          type: integer
          minimum: 1
        selectedFileIds:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
    ManagedImportPreview:
      type: object
      required: [jobId, status, revision, file]
      properties:
        jobId:
          type: string
          format: uuid
        status:
          type: string
          enum: [awaiting_confirmation]
        revision:
          type: integer
          minimum: 1
        file:
          $ref: "#/components/schemas/ManagedImportPreviewFile"
    ManagedImportPreviewFile:
      oneOf:
        - $ref: "#/components/schemas/ManagedImportFlacPreviewFile"
        - $ref: "#/components/schemas/ManagedImportWavPreviewFile"
        - $ref: "#/components/schemas/ManagedImportM4aPreviewFile"
        - $ref: "#/components/schemas/ManagedImportMp3PreviewFile"
        - $ref: "#/components/schemas/ManagedImportOggPreviewFile"
        - $ref: "#/components/schemas/ManagedImportOpusPreviewFile"
      discriminator:
        propertyName: format
        mapping:
          flac: "#/components/schemas/ManagedImportFlacPreviewFile"
          wav: "#/components/schemas/ManagedImportWavPreviewFile"
          m4a: "#/components/schemas/ManagedImportM4aPreviewFile"
          mp3: "#/components/schemas/ManagedImportMp3PreviewFile"
          ogg: "#/components/schemas/ManagedImportOggPreviewFile"
          opus: "#/components/schemas/ManagedImportOpusPreviewFile"
    ManagedImportPreviewFileCommon:
      type: object
      required:
        - originalFilename
        - title
        - artists
        - albumArtists
        - album
        - genres
        - trackNo
        - discNo
        - durationMs
        - sampleRateHz
        - channelCount
        - bitrateKbps
        - artworkMediaType
      properties:
        originalFilename:
          type: string
        title:
          type: string
        artists:
          type: array
          minItems: 1
          items:
            type: string
        albumArtists:
          type: array
          minItems: 1
          items:
            type: string
        album:
          type: string
        genres:
          type: array
          minItems: 1
          items:
            type: string
        trackNo:
          type: integer
          minimum: 1
        trackTotal:
          type: integer
          minimum: 1
        discNo:
          type: integer
          minimum: 1
        discTotal:
          type: integer
          minimum: 1
        year:
          type: integer
        durationMs:
          type: integer
          minimum: 1
        sampleRateHz:
          type: integer
          minimum: 1
        channelCount:
          type: integer
          minimum: 1
        bitrateKbps:
          type: integer
          minimum: 1
        artworkMediaType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
    ManagedImportFlacPreviewFile:
      allOf:
        - $ref: "#/components/schemas/ManagedImportPreviewFileCommon"
        - type: object
          required: [format, container, codec, bitDepth]
          properties:
            format:
              type: string
              const: flac
            container:
              type: string
              const: flac
            codec:
              type: string
              const: flac
            bitDepth:
              type: integer
              minimum: 1
    ManagedImportWavPreviewFile:
      allOf:
        - $ref: "#/components/schemas/ManagedImportPreviewFileCommon"
        - type: object
          required: [format, container, codec, bitDepth]
          properties:
            format:
              type: string
              const: wav
            container:
              type: string
              const: wav
            codec:
              type: string
              enum: ["pcm_u8", "pcm_s16le", "pcm_s24le", "pcm_s32le"]
            bitDepth:
              type: integer
              enum: [8, 16, 24, 32]
    ManagedImportM4aPreviewFile:
      allOf:
        - $ref: "#/components/schemas/ManagedImportPreviewFileCommon"
        - type: object
          required: [format, container, codec, bitDepth]
          properties:
            format:
              type: string
              const: m4a
            container:
              type: string
              const: m4a
            codec:
              type: string
              enum: [aac, alac]
            bitDepth:
              type: integer
              minimum: 0
              description: Source bit depth for ALAC; 0 for AAC.
    ManagedImportMp3PreviewFile:
      allOf:
        - $ref: "#/components/schemas/ManagedImportPreviewFileCommon"
        - type: object
          required: [format, container, codec]
          properties:
            format:
              type: string
              const: mp3
            container:
              type: string
              const: mp3
            codec:
              type: string
              const: mp3
    ManagedImportOggPreviewFile:
      allOf:
        - $ref: "#/components/schemas/ManagedImportPreviewFileCommon"
        - type: object
          required: [format, container, codec]
          properties:
            format:
              type: string
              const: ogg
            container:
              type: string
              const: ogg
            codec:
              type: string
              const: vorbis
    ManagedImportOpusPreviewFile:
      allOf:
        - $ref: "#/components/schemas/ManagedImportPreviewFileCommon"
        - type: object
          required: [format, container, codec]
          properties:
            format:
