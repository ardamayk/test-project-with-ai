      responses:
        "200":
          description: Radio stream
          content:
            audio/*:
              schema:
                type: string
                format: binary
            application/vnd.apple.mpegurl:
              schema:
                type: string
                format: binary
            application/x-mpegurl:
              schema:
                type: string
                format: binary
            video/*:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: Partial HLS media resource
          content:
            audio/*:
              schema:
                type: string
                format: binary
            video/*:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          description: DRM-protected HLS is unsupported
        "502":
          description: Upstream radio resource failed
  /api/v1/radio/stations/{stationId}/now-playing:
    get:
      tags: [radio]
      operationId: getRadioNowPlaying
      summary: Get latest radio now-playing metadata
      parameters:
        - $ref: "#/components/parameters/stationId"
      responses:
        "200":
          description: Now-playing metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RadioNowPlaying"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Gone:
      description: The requested legacy behavior is retired and will not run
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InsufficientStorage:
      description: Managed Storage cannot satisfy the configured reserve and temporary-space requirements
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RangeNotSatisfiable:
      description: Range not satisfiable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  parameters:
    limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 50
    offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    albumId:
      name: albumId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    trackId:
      name: trackId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    importId:
      name: importId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    batchId:
      name: batchId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    queueItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    playlistId:
      name: playlistId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    stationId:
      name: stationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    HealthResponse:
      type: object
      required: [status, version, capabilities]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
        capabilities:
          type: array
          items:
            type: string
          description: >-
            Named server behaviors supported by this release. The versioned
            /api/v1 surface itself is advertised as api.v1. Queue event streaming
            is advertised as playback.queue-events.v1 and the first strict FLAC
            Managed Import tracer bullet as managed-import.v1. Multi-file Managed
            Import Batches are advertised as managed-import-batches.v1, Permanent
            Track Deletion as managed-track-deletion.v1, explicit Track
            Replacement as managed-track-replacement.v1, and the explicit
            Library Migration workflow (preview, stage, cutover, and Legacy
            Source Cleanup) as library-migration.v1. Clients gate optional
            behavior on the exact capability name and must ignore unknown
            entries so newer servers stay compatible with older clients.
    User:
      type: object
      required: [id, username]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
    LayoutPreferences:
      type: object
      required: [sidebarPosition, panels, collapsed]
      properties:
        sidebarPosition:
          type: string
          enum: [left, right]
        panels:
          type: object
          required: [left, right]
          properties:
            left:
              type: array
              items:
                type: string
            right:
              type: array
              items:
                type: string
        collapsed:
          type: object
          required: [left, right]
          properties:
            left:
              type: boolean
            right:
              type: boolean
        sizes:
          type: array
          items:
            type: number
          minItems: 3
          maxItems: 3
          description: Panel widths as percentages [left, main, right]
    ThemePreferences:
      type: object
      required: [mode, preset]
      properties:
        mode:
          type: string
          enum: [light, dark, system]
        preset:
          type: string
          enum:
            - earthly
            - tokyo-night
            - vintage-harbor
            - night-ember
            - dusty-earth
            - coastal-mist
            - sage-hearth
    UserPreferences:
      type: object
      required: [theme, layout]
      properties:
        theme:
          $ref: "#/components/schemas/ThemePreferences"
        layout:
          $ref: "#/components/schemas/LayoutPreferences"
    UserPreferencesPatch:
      type: object
      properties:
        theme:
          $ref: "#/components/schemas/ThemePreferences"
        layout:
          $ref: "#/components/schemas/LayoutPreferences"
    ErrorResponse:
      type: object
      required: [error, code, message]
      properties:
        error:
          type: string
        code:
          type: string
        message:
          type: string
        field:
          type: string
          description: Machine-readable field associated with a structured validation failure.
        reason:
          type: string
          description: Actionable reason for a structured validation failure.
    ManagedImportJob:
      type: object
      required: [id, status, revision, validationProgress]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [uploading, awaiting_confirmation, committed, failed]
        revision:
          type: integer
          minimum: 1
        validationProgress:
          type: integer
          minimum: 0
          maximum: 100
        errorCode:
          type: string
          description: Stable failure code when status is failed.
        trackId:
          type: string
          format: uuid
          description: Created or replaced Track when status is committed.
        replacesTrackId:
          type: string
          format: uuid
          description: Present when this job is an explicit Track Replacement of that Track.
    ManagedImportJobCreate:
      type: object
      required: [batchId, clientFileId]
      properties:
        batchId:
          type: string
          format: uuid
          description: Import Batch that owns this per-file job.
        clientFileId:
          type: string
          format: uuid
          description: Client-generated identifier used to correlate a Batch file when the create response is lost.
    ManagedImportBatch:
      type: object
      required: [id, status, revision, files]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [uploading, confirming, completed]
        revision:
          type: integer
          minimum: 1
        files:
          type: array
          items:
            $ref: "#/components/schemas/ManagedImportBatchFile"
    ManagedImportBatchFile:
      type: object
      required: [jobId, state, status, revision, validationProgress, selected]
      properties:
        jobId:
          type: string
          format: uuid
        clientFileId:
          type: string
          format: uuid
        state:
          type: string
          enum: [accepted, rejected, unresolved, completed]
        status:
          type: string
          enum: [uploading, awaiting_confirmation, committed, failed]
        revision:
          type: integer
          minimum: 1
        validationProgress:
          type: integer
          minimum: 0
          maximum: 100
        originalFilename:
          type: string
        selected:
          type: boolean
        preview:
          $ref: "#/components/schemas/ManagedImportPreview"
        errorCode:
          type: string
        errorField:
          type: string
        errorReason:
          type: string
        outcome:
          type: string
          enum: [imported, rejected, failed, replaced, not_attempted]
        trackId:
          type: string
          format: uuid
    ManagedImportHistoryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/ManagedImportHistoryItem"
    ManagedImportHistoryItem:
      type: object
      required: [importId, startedAt, completedAt, resultCode, counts, files]
      properties:
        importId:
          type: string
          format: uuid
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        resultCode:
          type: string
          enum: [completed, partially_completed, failed, canceled]
        counts:
          $ref: "#/components/schemas/ManagedImportHistoryCounts"
        files:
          type: array
          items:
            $ref: "#/components/schemas/ManagedImportHistoryFile"
    ManagedImportHistoryCounts:
      type: object
      required: [total, imported, rejected, failed, replaced, notAttempted, canceled]
      properties:
        total:
          type: integer
          minimum: 0
        imported:
          type: integer
          minimum: 0
        rejected:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        replaced:
          type: integer
          minimum: 0
        notAttempted:
          type: integer
          minimum: 0
        canceled:
          type: integer
          minimum: 0
    ManagedImportHistoryFile:
      type: object
      required: [fileId, jobId, startedAt, completedAt, resultCode]
      properties:
        fileId:
          type: string
          format: uuid
        jobId:
          type: string
          format: uuid
        safeFilename:
          type: string
          maxLength: 255
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        contentSha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        resultCode:
          type: string
          minLength: 1
        createdTrackId:
          type: string
          format: uuid
        replacedTrackId:
          type: string
          format: uuid
    ManagedImportBatchConfirmation:
      type: object
      required: [revision, selectedFileIds]
      properties:
        revision:
          type: integer
          minimum: 1
        selectedFileIds:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
        duplicateDecisions:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ManagedImportDuplicateDecision"
    ManagedImportDuplicateDecision:
      type: object
      required: [jobId, action]
      properties:
        jobId:
          type: string
          format: uuid
        action:
          type: string
          enum: [import_separately, replace_existing, do_not_import]
    ManagedImportPreview:
      type: object
      required: [jobId, status, revision, file, duplicateClassification]
      properties:
        jobId:
          type: string
          format: uuid
        status:
          type: string
          enum: [awaiting_confirmation, failed]
        revision:
          type: integer
          minimum: 1
        file:
          $ref: "#/components/schemas/ManagedImportPreviewFile"
        duplicateClassification:
          type: string
          enum: [none, exact_duplicate, possible_duplicate]
        duplicateCandidates:
          type: array
          items:
            $ref: "#/components/schemas/ManagedImportDuplicateCandidate"
        replacement:
          $ref: "#/components/schemas/TrackReplacementPreview"
    ManagedImportDuplicateCandidate:
      type: object
      required: [trackId, title, artists, album, discNo, trackNo, format, durationMs]
      properties:
        trackId:
          type: string
          format: uuid
        title:
          type: string
        artists:
          type: array
          minItems: 1
          items:
            type: string
        album:
          type: string
        discNo:
          type: integer
          minimum: 1
        trackNo:
          type: integer
          minimum: 1
        format:
          type: string
        durationMs:
          type: integer
          minimum: 1
    LibraryMigrationPreview:
      type: object
      required: [acceptedCount, rejectedCount, files]
      properties:
        acceptedCount:
          type: integer
          minimum: 0
        rejectedCount:
          type: integer
          minimum: 0
        files:
          type: array
          items:
            $ref: "#/components/schemas/LibraryMigrationPreviewFile"
    LibraryMigrationPreviewFile:
      type: object
      required: [trackId, originalFilename, state]
      properties:
        trackId:
          type: string
          format: uuid
        originalFilename:
          type: string
          description: Display-only basename of the existing Legacy Track source.
        state:
          type: string
          enum: [accepted, rejected]
        preview:
          $ref: "#/components/schemas/ManagedImportPreviewFile"
        errorCode:
          type: string
          description: Stable Strict Import Profile or capacity failure code.
        errorField:
          type: string
          description: Machine-readable field associated with a rejection.
        errorReason:
          type: string
