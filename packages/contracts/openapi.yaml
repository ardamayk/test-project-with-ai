    QueueEvent:
      type: object
      required: [revision, sequence, invalidates]
      properties:
        revision:
          type: string
          description: Latest Queue Revision when this event was emitted
        sequence:
          type: string
          pattern: "^[0-9]+$"
          description: Monotonically increasing event order, independent from opaque Queue Revision semantics
        invalidates:
          type: array
          description: Shared resources clients must refetch
          items:
            type: string
            enum: [queue]
    QueueReplace:
      type: object
      required: [trackIds, revision]
      properties:
        trackIds:
          type: array
          items:
            type: string
            format: uuid
        revision:
          type: string
    QueueItemAppend:
      type: object
      required: [trackId, revision]
      properties:
        trackId:
          type: string
          format: uuid
        revision:
          type: string
    QueueReorder:
      type: object
      required: [itemIds, revision]
      properties:
        itemIds:
          type: array
          items:
            type: string
            format: uuid
        revision:
          type: string
    QueueConflictResponse:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - type: object
          required: [queue]
          properties:
            queue:
              $ref: "#/components/schemas/Queue"
