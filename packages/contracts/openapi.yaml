openapi: 3.0.3
info:
  title: Navidrome Replacement API
  version: 0.1.0
  description: Self-hosted music server API
servers:
  - url: http://localhost:8090
    description: Local development
tags:
  - name: system
  - name: user
  - name: preferences
  - name: library
  - name: playback
paths:
  /api/v1/health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Health check
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/me:
    get:
      tags: [user]
      operationId: getMe
      summary: Current user profile (stub)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/preferences:
    get:
      tags: [preferences]
      operationId: getPreferences
      summary: Get user preferences including layout
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreferences"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [preferences]
      operationId: patchPreferences
      summary: Update user preferences
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserPreferencesPatch"
      responses:
        "200":
          description: Updated preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreferences"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/library/scan:
    post:
      tags: [library]
      operationId: triggerLibraryScan
      summary: Trigger library scan
      responses:
        "202":
          description: Scan started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanStatus"
        "409":
          $ref: "#/components/responses/Conflict"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/library/scan/status:
    get:
      tags: [library]
      operationId: getLibraryScanStatus
      summary: Get current or latest scan status
      responses:
        "200":
          description: Scan status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanStatus"
  /api/v1/library/artists:
    get:
      tags: [library]
      operationId: listArtists
      summary: List artists
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - name: q
          in: query
          schema:
            type: string
          description: Search by name
      responses:
        "200":
          description: Artist list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtistList"
  /api/v1/library/albums:
    get:
      tags: [library]
      operationId: listAlbums
      summary: List albums
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - name: artistId
          in: query
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          schema:
            type: string
          description: Search by title
      responses:
        "200":
          description: Album list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlbumList"
  /api/v1/library/albums/{albumId}:
    get:
      tags: [library]
      operationId: getAlbum
      summary: Get album with tracks
      parameters:
        - $ref: "#/components/parameters/albumId"
      responses:
        "200":
          description: Album detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlbumDetail"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [library]
      operationId: deleteAlbum
      summary: Delete album, its tracks, and music files
      parameters:
        - $ref: "#/components/parameters/albumId"
      responses:
        "200":
          description: Album deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/library/albums/{albumId}/cover:
    get:
      tags: [library]
      operationId: getAlbumCover
      summary: Get album cover image
      parameters:
        - $ref: "#/components/parameters/albumId"
      responses:
        "200":
          description: Cover image
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/library/tracks:
    get:
      tags: [library]
      operationId: listTracks
      summary: List or search tracks
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - name: q
          in: query
          schema:
            type: string
          description: Search by title or artist
      responses:
        "200":
          description: Track list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackList"
  /api/v1/library/tracks/{trackId}:
    get:
      tags: [library]
      operationId: getTrack
      summary: Get track metadata
      parameters:
        - $ref: "#/components/parameters/trackId"
      responses:
        "200":
          description: Track metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Track"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [library]
      operationId: deleteTrack
      summary: Delete track and its music file
      parameters:
        - $ref: "#/components/parameters/trackId"
      responses:
        "200":
          description: Track deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/playback/queue:
    get:
      tags: [playback]
      operationId: getPlaybackQueue
      summary: Get playback queue
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Queue"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [playback]
      operationId: replacePlaybackQueue
      summary: Replace playback queue
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueueReplace"
      responses:
        "200":
          description: Updated queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Queue"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/playback/queue/items:
    post:
      tags: [playback]
      operationId: appendPlaybackQueueItem
      summary: Append track to queue
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueueItemAppend"
      responses:
        "200":
          description: Updated queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Queue"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/playback/queue/items/{itemId}:
    delete:
      tags: [playback]
      operationId: removePlaybackQueueItem
      summary: Remove item from queue
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/queueItemId"
      responses:
        "200":
          description: Updated queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Queue"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/tracks/{trackId}/stream:
    get:
      tags: [playback]
      operationId: streamTrack
      summary: Stream track audio with HTTP Range support
      parameters:
        - $ref: "#/components/parameters/trackId"
      responses:
        "200":
          description: Full audio stream
          content:
            audio/*:
              schema:
                type: string
                format: binary
        "206":
          description: Partial content (Range request)
          content:
            audio/*:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
        "416":
          $ref: "#/components/responses/RangeNotSatisfiable"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RangeNotSatisfiable:
      description: Range not satisfiable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  parameters:
    limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 50
    offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    albumId:
      name: albumId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    trackId:
      name: trackId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    queueItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    HealthResponse:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
    User:
      type: object
      required: [id, username]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
    LayoutPreferences:
      type: object
      required: [sidebarPosition, panels, collapsed]
      properties:
        sidebarPosition:
          type: string
          enum: [left, right]
        panels:
          type: object
          required: [left, right]
          properties:
            left:
              type: array
              items:
                type: string
            right:
              type: array
              items:
                type: string
        collapsed:
          type: object
          required: [left, right]
          properties:
            left:
              type: boolean
            right:
              type: boolean
        sizes:
          type: array
          items:
            type: number
          minItems: 3
          maxItems: 3
          description: Panel widths as percentages [left, main, right]
    ThemePreferences:
      type: object
      required: [mode, preset]
      properties:
        mode:
          type: string
          enum: [light, dark, system]
        preset:
          type: string
          enum:
            - earthly
            - tokyo-night
            - vintage-harbor
            - night-ember
            - dusty-earth
            - coastal-mist
            - sage-hearth
    UserPreferences:
      type: object
      required: [theme, layout]
      properties:
        theme:
          $ref: "#/components/schemas/ThemePreferences"
        layout:
          $ref: "#/components/schemas/LayoutPreferences"
    UserPreferencesPatch:
      type: object
      properties:
        theme:
          $ref: "#/components/schemas/ThemePreferences"
        layout:
          $ref: "#/components/schemas/LayoutPreferences"
    ErrorResponse:
      type: object
      required: [error, code, message]
      properties:
        error:
          type: string
        code:
          type: string
        message:
          type: string
    Artist:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        albumCount:
          type: integer
    ArtistList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Artist"
        total:
          type: integer
    Album:
      type: object
      required: [id, title, artistId, artistName]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        artistId:
          type: string
          format: uuid
        artistName:
          type: string
        year:
          type: integer
        trackCount:
          type: integer
        genres:
          type: array
          items:
            type: string
    AlbumList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Album"
        total:
          type: integer
    AlbumDetail:
      allOf:
        - $ref: "#/components/schemas/Album"
        - type: object
          required: [tracks]
          properties:
            tracks:
              type: array
              items:
                $ref: "#/components/schemas/Track"
    Track:
      type: object
      required: [id, title, artistName, albumId, durationMs, format]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        artistName:
          type: string
        albumId:
          type: string
          format: uuid
        albumTitle:
          type: string
        trackNo:
          type: integer
        durationMs:
          type: integer
        format:
          type: string
        genre:
          type: string
        sizeBytes:
          type: integer
    TrackList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Track"
        total:
          type: integer
    DeleteResult:
      type: object
      required: [deletedFiles]
      properties:
        deletedFiles:
          type: integer
    ScanStatus:
      type: object
      required: [status, scanned, added, updated, removed]
      properties:
        status:
          type: string
          enum: [idle, running, completed, failed]
        scanned:
          type: integer
        added:
          type: integer
        updated:
          type: integer
        removed:
          type: integer
        error:
          type: string
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
    QueueItem:
      type: object
      required: [id, trackId, position, track]
      properties:
        id:
          type: string
          format: uuid
        trackId:
          type: string
          format: uuid
        position:
          type: integer
        track:
          $ref: "#/components/schemas/Track"
    Queue:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/QueueItem"
    QueueReplace:
      type: object
      required: [trackIds]
      properties:
        trackIds:
          type: array
          items:
            type: string
            format: uuid
    QueueItemAppend:
      type: object
      required: [trackId]
      properties:
        trackId:
          type: string
          format: uuid
