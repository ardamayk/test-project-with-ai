      properties:
        currentMediaType:
          type: string
        currentSha256:
          type: string
        replacementMediaType:
          type: string
        replacementSha256:
          type: string
        isChanged:
          type: boolean
        replacesAlbumArtwork:
          type: boolean
          description: True when the Album's display artwork file itself is replaced.
    TrackReplacementFileDeletion:
      type: object
      required: [path, sizeBytes]
      properties:
        path:
          type: string
          description: Managed Storage-relative path of the previous managed file that will be deleted
        sizeBytes:
          type: integer
          minimum: 0
    TrackReplacementConfirmation:
      type: object
      required: [revision, confirmationToken]
      properties:
        revision:
          type: integer
          minimum: 1
        confirmationToken:
          type: string
    TrackReplacementResult:
      type: object
      required: [jobId, status, revision, trackId, deletedFiles]
      properties:
        jobId:
          type: string
          format: uuid
        status:
          type: string
          enum: [committed]
        revision:
          type: integer
          minimum: 1
        trackId:
          type: string
          format: uuid
        deletedFiles:
          type: integer
          minimum: 0
    ScanStatus:
      type: object
      deprecated: true
      description: >-
        Legacy scan status retained for API v1 compatibility. The scanner is
        retired, so the Music Server always reports idle with zero counts.
      required: [status, scanned, added, updated, removed]
      properties:
        status:
          type: string
          enum: [idle, running, completed, failed]
        scanned:
          type: integer
        added:
          type: integer
        updated:
          type: integer
        removed:
          type: integer
        error:
          type: string
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
    QueueItem:
      type: object
      required: [id, trackId, position, track]
      properties:
        id:
          type: string
          format: uuid
        trackId:
          type: string
          format: uuid
        position:
          type: integer
        track:
          $ref: "#/components/schemas/Track"
    Queue:
      type: object
      required: [items, revision]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/QueueItem"
        revision:
          type: string
          description: Opaque version of this Queue state
    QueueEvent:
      type: object
      required: [revision, sequence, invalidates]
      properties:
        revision:
          type: string
          description: Latest Queue Revision when this event was emitted
        sequence:
          type: string
          pattern: "^[0-9]+$"
          description: Monotonically increasing event order, independent from opaque Queue Revision semantics
        invalidates:
          type: array
          description: Shared resources clients must refetch
          items:
            type: string
            enum: [queue]
    QueueReplace:
      type: object
      required: [trackIds, revision]
      properties:
        trackIds:
          type: array
          items:
            type: string
            format: uuid
        revision:
          type: string
    QueueItemAppend:
      type: object
      required: [trackId, revision]
      properties:
        trackId:
          type: string
          format: uuid
        revision:
          type: string
    QueueReorder:
      type: object
      required: [itemIds, revision]
      properties:
        itemIds:
          type: array
          items:
            type: string
            format: uuid
        revision:
          type: string
    QueueConflictResponse:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - type: object
          required: [queue]
          properties:
            queue:
              $ref: "#/components/schemas/Queue"
