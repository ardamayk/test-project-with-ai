[package]
name = "earthly-audio-desktop"
version = "0.1.0"
description = "Earthly Audio Desktop Client"
edition = "2024"

[lib]
name = "earthly_audio_desktop"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
cap-std = "=4.0.2"
cap-fs-ext = "=4.0.2"
futures-util = "=0.3.34"
getrandom = "=0.4.3"
libc = "=0.2.189"
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-plugin-dialog = "=2.7.3"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["fs", "io-util", "net", "sync"] }
tokio-util = { version = "=0.7.19", features = ["io", "rt"] }
url = "=2.5.8"
uuid = { version = "=1.25.0", features = ["v4"] }

[dev-dependencies]
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "time"] }
