# Pull-request Fast Gate and trusted main fast verification.
#
# Non-required early checks that run next to the existing required `lint-test`
# and `e2e` checks. Every check command is a public Mise task from mise.toml.
# Pull requests restore caches but never publish them. Main updates run every
# job and publish trusted pnpm, Turbo, Go, golangci-lint, and Cargo caches.

name: PR

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded pull-request revisions. Main runs always finish so every
# merged revision retains a complete static and unit health signal.
concurrency:
  group: pr-fast-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  VERIFICATION_LABEL: ${{ github.event_name == 'push' && 'Main / Fast Verification' || 'PR / Fast Gate' }}

jobs:
  classify:
    name: Classify changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    outputs:
      desktop_unit: ${{ steps.classify.outputs.desktop_unit }}
      generated_drift: ${{ steps.classify.outputs.generated_drift }}
      reasons: ${{ steps.classify.outputs.reasons }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The classifier diffs the pull-request base against the merge commit.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Mise toolchain
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          cache_save: false

      # Conditional validation depends on the classifier, so its own fixture
      # suite must pass before its outputs are trusted.
      - name: Test pull-request change classifier
        run: mise run classifier:test

      - name: Classify pull-request changes
        id: classify
        run: |
          node scripts/classify-pr-changes.mjs \
            --base '${{ github.event.pull_request.base.sha }}' \
            --head '${{ github.sha }}' \
            --format github >> "$GITHUB_OUTPUT"

  workspace:
    name: Workspace checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [classify]
    if: always() && (github.event_name == 'push' || needs.classify.result == 'success')
    outputs:
      duration: ${{ steps.summary.outputs.duration }}
      cache_pnpm_hit: ${{ steps.pnpm_cache.outputs.cache-hit }}
      cache_pnpm_key: ${{ steps.pnpm_cache.outputs.cache-matched-key }}
      cache_turbo_hit: ${{ steps.turbo_cache.outputs.cache-hit }}
      cache_turbo_key: ${{ steps.turbo_cache.outputs.cache-matched-key }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Record start time
        id: timer
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Set up Mise toolchain
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          # Pull requests must not publish caches.
          cache_save: false

      - name: Resolve pnpm store path
        id: pnpm_store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store cache
        id: pnpm_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.pnpm_store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Restore Turbo cache
        id: turbo_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}-${{ hashFiles('turbo.json') }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}-${{ hashFiles('turbo.json') }}-

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # `biome check` covers formatting, linting, and assists, matching the
      # `mise run check` policy exactly.
      - name: Workspace static checks
        id: check
        run: mise run workspace:check

      - name: Type-check workspace
        id: typecheck
        run: mise run workspace:typecheck

      - name: Workspace unit tests
        id: test
        run: mise run workspace:test

      - name: Publish pnpm store cache
        if: github.event_name == 'push' && steps.pnpm_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.pnpm_store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Publish Turbo cache
        if: github.event_name == 'push' && steps.turbo_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}-${{ hashFiles('turbo.json') }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Publish job summary
        id: summary
        if: always()
        env:
          START: ${{ steps.timer.outputs.start }}
          CHECK_OUTCOME: ${{ steps.check.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          PNPM_CACHE_HIT: ${{ steps.pnpm_cache.outputs.cache-hit }}
          PNPM_CACHE_KEY: ${{ steps.pnpm_cache.outputs.cache-matched-key }}
          TURBO_CACHE_HIT: ${{ steps.turbo_cache.outputs.cache-hit }}
          TURBO_CACHE_KEY: ${{ steps.turbo_cache.outputs.cache-matched-key }}
        run: |
          duration=$(( $(date +%s) - START ))
          cache_status() {
            if [[ "$1" == "true" ]]; then echo "hit"
            elif [[ -n "$2" ]]; then echo "hit (partial)"
            else echo "miss"
            fi
          }
          {
            echo "### ${VERIFICATION_LABEL} — Workspace checks"
            echo
            echo "| Check | Result |"
            echo "| ----- | ------ |"
            echo "| Static checks (format, lint, assists) | ${CHECK_OUTCOME:-not run} |"
            echo "| Type check | ${TYPECHECK_OUTCOME:-not run} |"
            echo "| Unit tests | ${TEST_OUTCOME:-not run} |"
            echo
            echo "| Cache | Status |"
            echo "| ----- | ------ |"
            echo "| pnpm store | $(cache_status "$PNPM_CACHE_HIT" "$PNPM_CACHE_KEY") |"
            echo "| Turbo | $(cache_status "$TURBO_CACHE_HIT" "$TURBO_CACHE_KEY") |"
            echo
            echo "Duration: ${duration}s"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "duration=${duration}s" >> "$GITHUB_OUTPUT"

  music-server:
    name: Music Server checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [classify]
    if: always() && (github.event_name == 'push' || needs.classify.result == 'success')
    outputs:
      duration: ${{ steps.summary.outputs.duration }}
      cache_go_hit: ${{ steps.go_cache.outputs.cache-hit }}
      cache_go_key: ${{ steps.go_cache.outputs.cache-matched-key }}
      cache_golangci_hit: ${{ steps.golangci_cache.outputs.cache-hit }}
      cache_golangci_key: ${{ steps.golangci_cache.outputs.cache-matched-key }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Record start time
        id: timer
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Set up Mise toolchain
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          cache_save: false

      # The Music Server shells out to ffprobe/ffmpeg for library import.
      - name: Install Music Server system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Restore Go module and build caches
        id: go_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}-${{ hashFiles('server/go.sum') }}

      - name: Restore golangci-lint cache
        id: golangci_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}-${{ hashFiles('server/.golangci.yml', 'server/go.sum') }}

      - name: Verify Music Server formatting
        id: format
        run: mise run server:format:check

      - name: Lint Music Server
        id: lint
        run: |
          mkdir -p "$RUNNER_TEMP/fast-gate-logs"
          mise run server:lint 2>&1 | tee "$RUNNER_TEMP/fast-gate-logs/golangci-lint.log"

      - name: Music Server unit tests
        id: test
        run: |
          mkdir -p "$RUNNER_TEMP/fast-gate-logs"
          mise run server:test 2>&1 | tee "$RUNNER_TEMP/fast-gate-logs/go-test.log"

      - name: Publish Go module and build caches
        if: github.event_name == 'push' && steps.go_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}-${{ hashFiles('server/go.sum') }}

      - name: Publish golangci-lint cache
        if: github.event_name == 'push' && steps.golangci_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}-${{ hashFiles('server/.golangci.yml', 'server/go.sum') }}

      - name: Publish job summary
        id: summary
        if: always()
        env:
          START: ${{ steps.timer.outputs.start }}
          FORMAT_OUTCOME: ${{ steps.format.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          GO_CACHE_HIT: ${{ steps.go_cache.outputs.cache-hit }}
          GO_CACHE_KEY: ${{ steps.go_cache.outputs.cache-matched-key }}
          GOLANGCI_CACHE_HIT: ${{ steps.golangci_cache.outputs.cache-hit }}
          GOLANGCI_CACHE_KEY: ${{ steps.golangci_cache.outputs.cache-matched-key }}
        run: |
          duration=$(( $(date +%s) - START ))
          cache_status() {
            if [[ "$1" == "true" ]]; then echo "hit"
            elif [[ -n "$2" ]]; then echo "hit (partial)"
            else echo "miss"
            fi
          }
          {
            echo "### ${VERIFICATION_LABEL} — Music Server checks"
            echo
            echo "| Check | Result |"
            echo "| ----- | ------ |"
            echo "| Formatting | ${FORMAT_OUTCOME:-not run} |"
            echo "| golangci-lint | ${LINT_OUTCOME:-not run} |"
            echo "| Unit tests | ${TEST_OUTCOME:-not run} |"
            echo
            echo "| Cache | Status |"
            echo "| ----- | ------ |"
            echo "| Go modules and build | $(cache_status "$GO_CACHE_HIT" "$GO_CACHE_KEY") |"
            echo "| golangci-lint | $(cache_status "$GOLANGCI_CACHE_HIT" "$GOLANGCI_CACHE_KEY") |"
            echo
            echo "Duration: ${duration}s"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "duration=${duration}s" >> "$GITHUB_OUTPUT"

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fast-gate-music-server-logs
          path: ${{ runner.temp }}/fast-gate-logs/
          if-no-files-found: ignore
          retention-days: 7

  desktop:
    name: Desktop Client checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [classify]
    if: always() && (github.event_name == 'push' || (needs.classify.result == 'success' && needs.classify.outputs.desktop_unit == 'true'))
    outputs:
      duration: ${{ steps.summary.outputs.duration }}
      cache_pnpm_hit: ${{ steps.pnpm_cache.outputs.cache-hit }}
      cache_pnpm_key: ${{ steps.pnpm_cache.outputs.cache-matched-key }}
      cache_cargo_hit: ${{ steps.cargo_cache.outputs.cache-hit }}
      cache_cargo_key: ${{ steps.cargo_cache.outputs.cache-matched-key }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Record start time
        id: timer
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Set up Mise toolchain
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          cache_save: false

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ffmpeg \
            libayatana-appindicator3-dev \
            libass-dev \
            libavcodec-dev \
            libavfilter-dev \
            libavformat-dev \
            libavutil-dev \
            libplacebo-dev \
            librsvg2-dev \
            libssl-dev \
            libswresample-dev \
            libswscale-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            meson \
            ninja-build \
            pkg-config

      - name: Resolve pnpm store path
        id: pnpm_store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store cache
        id: pnpm_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.pnpm_store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Record Rust toolchain version
        id: rust
        run: echo "version=$(rustc --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"

      - name: Restore Cargo caches
        id: cargo_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            desktop/src-tauri/target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.version }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Desktop Client formatting
        id: format
        run: mise run desktop:format:check

      - name: Lint Desktop Client with Clippy
        id: lint
        run: |
          mkdir -p "$RUNNER_TEMP/fast-gate-logs"
          mise run desktop:lint 2>&1 | tee "$RUNNER_TEMP/fast-gate-logs/cargo-clippy.log"

      - name: Desktop Client unit tests
        id: test
        run: |
          mkdir -p "$RUNNER_TEMP/fast-gate-logs"
          mise run desktop:test 2>&1 | tee "$RUNNER_TEMP/fast-gate-logs/cargo-test.log"

      - name: Publish Cargo cache
        if: github.event_name == 'push' && steps.cargo_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            desktop/src-tauri/target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.version }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}

      - name: Publish job summary
        id: summary
        if: always()
        env:
          START: ${{ steps.timer.outputs.start }}
          FORMAT_OUTCOME: ${{ steps.format.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          PNPM_CACHE_HIT: ${{ steps.pnpm_cache.outputs.cache-hit }}
          PNPM_CACHE_KEY: ${{ steps.pnpm_cache.outputs.cache-matched-key }}
          CARGO_CACHE_HIT: ${{ steps.cargo_cache.outputs.cache-hit }}
          CARGO_CACHE_KEY: ${{ steps.cargo_cache.outputs.cache-matched-key }}
        run: |
          duration=$(( $(date +%s) - START ))
          cache_status() {
            if [[ "$1" == "true" ]]; then echo "hit"
            elif [[ -n "$2" ]]; then echo "hit (partial)"
            else echo "miss"
            fi
          }
          {
            echo "### ${VERIFICATION_LABEL} — Desktop Client checks"
            echo
            echo "| Check | Result |"
            echo "| ----- | ------ |"
            echo "| Formatting | ${FORMAT_OUTCOME:-not run} |"
            echo "| Clippy | ${LINT_OUTCOME:-not run} |"
            echo "| Unit tests | ${TEST_OUTCOME:-not run} |"
            echo
            echo "| Cache | Status |"
            echo "| ----- | ------ |"
            echo "| pnpm store | $(cache_status "$PNPM_CACHE_HIT" "$PNPM_CACHE_KEY") |"
            echo "| Cargo | $(cache_status "$CARGO_CACHE_HIT" "$CARGO_CACHE_KEY") |"
            echo
            echo "Duration: ${duration}s"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "duration=${duration}s" >> "$GITHUB_OUTPUT"

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fast-gate-desktop-client-logs
          path: ${{ runner.temp }}/fast-gate-logs/
          if-no-files-found: ignore
          retention-days: 7

  generated-drift:
    name: Generated drift check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [classify]
    if: always() && (github.event_name == 'push' || (needs.classify.result == 'success' && needs.classify.outputs.generated_drift == 'true'))
    outputs:
      duration: ${{ steps.summary.outputs.duration }}
      cache_pnpm_hit: ${{ steps.pnpm_cache.outputs.cache-hit }}
      cache_pnpm_key: ${{ steps.pnpm_cache.outputs.cache-matched-key }}
      cache_go_hit: ${{ steps.go_cache.outputs.cache-hit }}
      cache_go_key: ${{ steps.go_cache.outputs.cache-matched-key }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Record start time
        id: timer
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Set up Mise toolchain
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          cache_save: false

      - name: Resolve pnpm store path
        id: pnpm_store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store cache
        id: pnpm_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.pnpm_store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Restore Go module and build caches
        id: go_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}-${{ hashFiles('server/go.sum') }}

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify committed OpenAPI outputs
        id: drift
        run: |
          mkdir -p "$RUNNER_TEMP/fast-gate-logs"
          mise run generate:check 2>&1 | tee "$RUNNER_TEMP/fast-gate-logs/generated-drift.log"

      - name: Publish job summary
        id: summary
        if: always()
        env:
          START: ${{ steps.timer.outputs.start }}
          DRIFT_OUTCOME: ${{ steps.drift.outcome }}
          PNPM_CACHE_HIT: ${{ steps.pnpm_cache.outputs.cache-hit }}
          PNPM_CACHE_KEY: ${{ steps.pnpm_cache.outputs.cache-matched-key }}
          GO_CACHE_HIT: ${{ steps.go_cache.outputs.cache-hit }}
          GO_CACHE_KEY: ${{ steps.go_cache.outputs.cache-matched-key }}
        run: |
          duration=$(( $(date +%s) - START ))
          cache_status() {
            if [[ "$1" == "true" ]]; then echo "hit"
            elif [[ -n "$2" ]]; then echo "hit (partial)"
            else echo "miss"
            fi
          }
          {
            echo "### ${VERIFICATION_LABEL} — Generated drift check"
            echo
            echo "| Check | Result |"
            echo "| ----- | ------ |"
            echo "| OpenAPI drift | ${DRIFT_OUTCOME:-not run} |"
            echo
            echo "| Cache | Status |"
            echo "| ----- | ------ |"
            echo "| pnpm store | $(cache_status "$PNPM_CACHE_HIT" "$PNPM_CACHE_KEY") |"
            echo "| Go modules and build | $(cache_status "$GO_CACHE_HIT" "$GO_CACHE_KEY") |"
            echo
            echo "Duration: ${duration}s"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "duration=${duration}s" >> "$GITHUB_OUTPUT"

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fast-gate-generated-drift-logs
          path: ${{ runner.temp }}/fast-gate-logs/
          if-no-files-found: ignore
          retention-days: 7

  fast-gate:
    name: Fast Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [classify, workspace, music-server, desktop, generated-drift]
    if: always()
    outputs:
      result: ${{ steps.result.outputs.result }}
    steps:
      - name: Evaluate gate result
        id: result
        env:
          EVENT_NAME: ${{ github.event_name }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          WORKSPACE_RESULT: ${{ needs.workspace.result }}
          SERVER_RESULT: ${{ needs.music-server.result }}
          DESKTOP_RESULT: ${{ needs.desktop.result }}
          DRIFT_RESULT: ${{ needs.generated-drift.result }}
        run: |
          # Pull-request classification must succeed and conditional PR jobs
          # may skip. Every trusted main job must complete successfully.
          result=success
          if [[ "$EVENT_NAME" == "pull_request" && "$CLASSIFY_RESULT" != "success" ]]; then
            result=failure
          fi
          for status in "$WORKSPACE_RESULT" "$SERVER_RESULT" "$DESKTOP_RESULT" "$DRIFT_RESULT"; do
            if [[ "$EVENT_NAME" == "push" && "$status" != "success" ]]; then
              result=failure
            elif [[ "$EVENT_NAME" == "pull_request" && "$status" != "success" && "$status" != "skipped" ]]; then
              result=failure
            fi
          done
          echo "result=$result" >> "$GITHUB_OUTPUT"

      - name: Publish gate summary
        if: always()
        env:
          EVENT_NAME: ${{ github.event_name }}
          RESULT: ${{ steps.result.outputs.result }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          DESKTOP_UNIT: ${{ needs.classify.outputs.desktop_unit }}
          GENERATED_DRIFT: ${{ needs.classify.outputs.generated_drift }}
          REASONS: ${{ needs.classify.outputs.reasons }}
          WORKSPACE_RESULT: ${{ needs.workspace.result }}
          WORKSPACE_DURATION: ${{ needs.workspace.outputs.duration }}
          WORKSPACE_PNPM_HIT: ${{ needs.workspace.outputs.cache_pnpm_hit }}
          WORKSPACE_PNPM_KEY: ${{ needs.workspace.outputs.cache_pnpm_key }}
          WORKSPACE_TURBO_HIT: ${{ needs.workspace.outputs.cache_turbo_hit }}
          WORKSPACE_TURBO_KEY: ${{ needs.workspace.outputs.cache_turbo_key }}
          SERVER_RESULT: ${{ needs.music-server.result }}
          SERVER_DURATION: ${{ needs.music-server.outputs.duration }}
          SERVER_GO_HIT: ${{ needs.music-server.outputs.cache_go_hit }}
          SERVER_GO_KEY: ${{ needs.music-server.outputs.cache_go_key }}
          SERVER_GOLANGCI_HIT: ${{ needs.music-server.outputs.cache_golangci_hit }}
          SERVER_GOLANGCI_KEY: ${{ needs.music-server.outputs.cache_golangci_key }}
          DESKTOP_RESULT: ${{ needs.desktop.result }}
          DESKTOP_DURATION: ${{ needs.desktop.outputs.duration }}
          DESKTOP_PNPM_HIT: ${{ needs.desktop.outputs.cache_pnpm_hit }}
          DESKTOP_PNPM_KEY: ${{ needs.desktop.outputs.cache_pnpm_key }}
          DESKTOP_CARGO_HIT: ${{ needs.desktop.outputs.cache_cargo_hit }}
          DESKTOP_CARGO_KEY: ${{ needs.desktop.outputs.cache_cargo_key }}
          DRIFT_RESULT: ${{ needs.generated-drift.result }}
          DRIFT_DURATION: ${{ needs.generated-drift.outputs.duration }}
          DRIFT_PNPM_HIT: ${{ needs.generated-drift.outputs.cache_pnpm_hit }}
          DRIFT_PNPM_KEY: ${{ needs.generated-drift.outputs.cache_pnpm_key }}
          DRIFT_GO_HIT: ${{ needs.generated-drift.outputs.cache_go_hit }}
          DRIFT_GO_KEY: ${{ needs.generated-drift.outputs.cache_go_key }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cache_status() {
            if [[ "$1" == "true" ]]; then echo "hit"
            elif [[ -n "$2" ]]; then echo "hit (partial)"
            else echo "miss"
            fi
          }
          # A job that did not run reports no cache status at all.
          cache_cell() {
            if [[ -z "$1" ]]; then
              echo "—"
              return
            fi
            shift
            local out=""
            local spec
            for spec in "$@"; do
              local name="${spec%%|*}"
              local hit="${spec#*|}"
              hit="${hit%%|*}"
              local key="${spec##*|}"
              [[ -n "$out" ]] && out+=", "
              out+="$name $(cache_status "$hit" "$key")"
            done
            echo "$out"
          }
          workspace_caches="$(cache_cell "$WORKSPACE_DURATION" \
            "pnpm|$WORKSPACE_PNPM_HIT|$WORKSPACE_PNPM_KEY" \
            "turbo|$WORKSPACE_TURBO_HIT|$WORKSPACE_TURBO_KEY")"
          server_caches="$(cache_cell "$SERVER_DURATION" \
            "go|$SERVER_GO_HIT|$SERVER_GO_KEY" \
            "golangci-lint|$SERVER_GOLANGCI_HIT|$SERVER_GOLANGCI_KEY")"
          desktop_caches="$(cache_cell "$DESKTOP_DURATION" \
            "pnpm|$DESKTOP_PNPM_HIT|$DESKTOP_PNPM_KEY" \
            "cargo|$DESKTOP_CARGO_HIT|$DESKTOP_CARGO_KEY")"
          drift_caches="$(cache_cell "$DRIFT_DURATION" \
            "pnpm|$DRIFT_PNPM_HIT|$DRIFT_PNPM_KEY" \
            "go|$DRIFT_GO_HIT|$DRIFT_GO_KEY")"
          if [[ "$EVENT_NAME" == "push" ]]; then
            desktop_decision="included — trusted main verification"
          elif [[ -z "$DESKTOP_UNIT" ]]; then
            desktop_decision="skipped — classification unavailable (classify job did not succeed)"
          elif [[ "$DESKTOP_UNIT" == "true" ]]; then
            desktop_decision="included (classifier: desktop_unit=true)"
          else
            desktop_decision="skipped — no Desktop Client, contract, global, or unknown-path changes"
          fi
          if [[ "$EVENT_NAME" == "push" ]]; then
            drift_decision="included — trusted main verification"
          elif [[ -z "$GENERATED_DRIFT" ]]; then
            drift_decision="skipped — classification unavailable (classify job did not succeed)"
          elif [[ "$GENERATED_DRIFT" == "true" ]]; then
            drift_decision="included (classifier: generated_drift=true)"
          else
            drift_decision="skipped — no contract, global, or unknown-path changes"
          fi
          {
            echo "# ${VERIFICATION_LABEL}"
            echo
            echo "Result: **$RESULT**"
            echo
            echo "| Job | Result | Duration | Caches |"
            echo "| --- | ------ | -------- | ------ |"
            echo "| Classify changes | $CLASSIFY_RESULT | — | — |"
            echo "| Workspace checks | $WORKSPACE_RESULT | ${WORKSPACE_DURATION:-—} | $workspace_caches |"
            echo "| Music Server checks | $SERVER_RESULT | ${SERVER_DURATION:-—} | $server_caches |"
            echo "| Desktop Client checks | $DESKTOP_RESULT | ${DESKTOP_DURATION:-—} | $desktop_caches |"
            echo "| Generated drift check | $DRIFT_RESULT | ${DRIFT_DURATION:-—} | $drift_caches |"
            echo
            echo "## Classifier decision"
            echo
            echo "| Decision | Value |"
            echo "| -------- | ----- |"
            echo "| desktop_unit | ${DESKTOP_UNIT:-unknown} |"
            echo "| generated_drift | ${GENERATED_DRIFT:-unknown} |"
            echo "| Reasons | ${REASONS:-unknown} |"
            echo
            echo "## Conditional jobs"
            echo
            echo "- Desktop Client checks: $desktop_decision"
            echo "- Generated drift check: $drift_decision"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$RESULT" != "success" ]]; then
            log_artifacts=""
            if [[ "$SERVER_RESULT" == "failure" ]]; then
              log_artifacts+="- \`fast-gate-music-server-logs\`"$'\n'
            fi
            if [[ "$DESKTOP_RESULT" == "failure" ]]; then
              log_artifacts+="- \`fast-gate-desktop-client-logs\`"$'\n'
            fi
            if [[ "$DRIFT_RESULT" == "failure" ]]; then
              log_artifacts+="- \`fast-gate-generated-drift-logs\`"$'\n'
            fi
            {
              echo
              echo "## Failure diagnostics"
              echo
              if [[ -n "$log_artifacts" ]]; then
                echo "Failed-check logs are attached to this run:"
                echo
                printf '%s' "$log_artifacts"
                echo
                echo "Run: $RUN_URL"
              else
                echo "No log artifacts apply to this failure; see the failed job's step output: $RUN_URL"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Enforce gate result
        if: steps.result.outputs.result == 'failure'
        run: |
          echo "${VERIFICATION_LABEL} failed; see the gate summary for diagnostics." >&2
          exit 1
