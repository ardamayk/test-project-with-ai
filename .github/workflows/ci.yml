name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev

      - name: Install JS deps
        run: pnpm install

      - name: Generate OpenAPI
        run: pnpm generate

      - name: Check codegen drift
        run: git diff --exit-code

      - name: Lint web
        run: pnpm --filter web check

      - name: Core unit tests
        run: pnpm test:core

      - name: Desktop unit tests
        run: pnpm test:desktop

      - name: Real mpv integration when pinned mpv is available
        shell: bash
        run: |
          if ! command -v mpv >/dev/null; then
            echo "Skipping real mpv integration: mpv is not installed."
            exit 0
          fi
          PINNED_MPV_VERSION="$(tr -d '\r\n' < desktop/src-tauri/mpv-version.txt)"
          if [[ "$(mpv --version | sed -n '1p')" != "mpv v${PINNED_MPV_VERSION}"* ]]; then
            echo "Skipping real mpv integration: pinned mpv ${PINNED_MPV_VERSION} is unavailable."
            exit 0
          fi
          pnpm --filter @repo/desktop test:mpv

      - name: Go test
        working-directory: server
        run: go test ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          working-directory: server

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: pnpm install
      - run: pnpm generate
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Install Playwright
        run: pnpm --filter web exec playwright install chromium --with-deps
      - name: E2E tests
        run: pnpm test:e2e
      - name: HLS browser integration
        run: pnpm test:e2e:hls
