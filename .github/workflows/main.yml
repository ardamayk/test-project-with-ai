# Full trusted verification after every main update (issue #80).
#
# Public Mise tasks remain the execution contract. Domain jobs run in parallel,
# publish trusted caches, keep 14-day diagnostics, and build separate Music
# Server and Desktop Client artifacts without coupling their runtime lifecycle.

name: Main

on:
  push:
    branches: [main]

concurrency:
  group: main-verification-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  ARTIFACT_RETENTION_DAYS: 14
  MPV_SOURCE_SHA256: ee21092a5ee427353392360929dc64645c54479aefdb5babc5cfbb5fad626209
  MPV_BUILD_FLAGS: "--buildtype=release --auto-features=disabled -Dbuild-date=false -Dgl=disabled -Dlibmpv=false"

jobs:
  workspace:
    name: Workspace, Web E2E, and Web build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      duration: ${{ steps.summary.outputs.duration }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Record start time
        id: timer
        run: |
          echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/main-workspace-logs"

      - name: Set up Mise toolchain
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          cache_save: false

      - name: Resolve pnpm store path
        id: pnpm_store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store cache
        id: pnpm_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm_store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Restore Turbo cache
        id: turbo_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}-${{ hashFiles('turbo.json') }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}-${{ hashFiles('turbo.json') }}-

      - name: Restore Playwright browser cache
        id: playwright_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('web/package.json') }}

      - name: Install JS dependencies
        id: install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        id: playwright_install
        if: ${{ !cancelled() }}
        run: pnpm --filter web exec playwright install chromium --with-deps

      - name: Workspace static checks
        id: check
        if: ${{ !cancelled() }}
        run: mise run workspace:check 2>&1 | tee "$RUNNER_TEMP/main-workspace-logs/workspace-check.log"

      - name: Workspace type check
        id: typecheck
        if: ${{ !cancelled() }}
        run: mise run workspace:typecheck 2>&1 | tee "$RUNNER_TEMP/main-workspace-logs/workspace-typecheck.log"

      - name: Workspace unit tests
        id: unit
        if: ${{ !cancelled() }}
        run: mise run workspace:test 2>&1 | tee "$RUNNER_TEMP/main-workspace-logs/workspace-unit.log"

      - name: Repository policy tests
        id: policy
        if: ${{ !cancelled() }}
        run: |
          result=0
          mise run git-hooks:test 2>&1 | tee "$RUNNER_TEMP/main-workspace-logs/git-hooks.log" || result=1
          mise run classifier:test 2>&1 | tee "$RUNNER_TEMP/main-workspace-logs/classifier.log" || result=1
          mise run main-workflows:test 2>&1 | tee "$RUNNER_TEMP/main-workspace-logs/main-workflows.log" || result=1
          exit "$result"

      - name: Web E2E verification
        id: e2e
        if: ${{ !cancelled() }}
        run: mise run web:test:e2e 2>&1 | tee "$RUNNER_TEMP/main-workspace-logs/web-e2e.log"

      - name: Build Web Client production artifact
        id: build
        if: ${{ !cancelled() }}
        run: mise run web:build 2>&1 | tee "$RUNNER_TEMP/main-workspace-logs/web-build.log"

      - name: Publish pnpm store cache
        if: ${{ !cancelled() && steps.pnpm_cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm_store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Publish Turbo cache
        if: ${{ !cancelled() && steps.turbo_cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}-${{ hashFiles('turbo.json') }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Publish Playwright browser cache
        if: ${{ !cancelled() && steps.playwright_install.outcome == 'success' && steps.playwright_cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('web/package.json') }}

      - name: Upload Web Client production artifact
        if: ${{ always() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: main-web-client
          path: web/dist/
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      - name: Upload workspace failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: main-workspace-diagnostics
          path: |
            ${{ runner.temp }}/main-workspace-logs/
            web/playwright-report/
            web/test-results/
          if-no-files-found: ignore
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      - name: Publish workspace summary
        id: summary
        if: always()
        env:
          START: ${{ steps.timer.outputs.start }}
          CHECK_OUTCOME: ${{ steps.check.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          UNIT_OUTCOME: ${{ steps.unit.outcome }}
          POLICY_OUTCOME: ${{ steps.policy.outcome }}
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          PNPM_CACHE_HIT: ${{ steps.pnpm_cache.outputs.cache-hit }}
          TURBO_CACHE_HIT: ${{ steps.turbo_cache.outputs.cache-hit }}
          PLAYWRIGHT_CACHE_HIT: ${{ steps.playwright_cache.outputs.cache-hit }}
        run: |
          duration=$(( $(date +%s) - ${START:-$(date +%s)} ))
          {
            echo "### Main — Workspace, Web E2E, and Web build"
            echo
            echo "| Check | Result |"
            echo "| ----- | ------ |"
            echo "| Static checks | ${CHECK_OUTCOME:-not run} |"
            echo "| Type check | ${TYPECHECK_OUTCOME:-not run} |"
            echo "| Unit tests (no retries) | ${UNIT_OUTCOME:-not run} |"
            echo "| Repository policy tests (no retries) | ${POLICY_OUTCOME:-not run} |"
            echo "| Web E2E (one CI retry with tracing) | ${E2E_OUTCOME:-not run} |"
            echo "| Web Client production build | ${BUILD_OUTCOME:-not run} |"
            echo
            echo "Caches: pnpm=${PNPM_CACHE_HIT:-miss}, Turbo=${TURBO_CACHE_HIT:-miss}, Playwright=${PLAYWRIGHT_CACHE_HIT:-miss}"
            echo
            echo "Coverage reason: full trusted main verification; no jobs skipped by change classification."
            echo
            echo "Artifacts: \`main-web-client\`; failures: \`main-workspace-diagnostics\` (14 days)."
            echo
            echo "Duration: ${duration}s"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "duration=${duration}s" >> "$GITHUB_OUTPUT"

  music-server:
    name: Music Server, HLS, docs, and server build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      duration: ${{ steps.summary.outputs.duration }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Record start time
        id: timer
        run: |
          echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/main-server-logs"

      - name: Set up Mise toolchain
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          cache_save: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Resolve pnpm store path
        id: pnpm_store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store cache
        id: pnpm_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm_store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Restore Turbo cache
        id: turbo_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}-${{ hashFiles('turbo.json') }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Restore Go module and build caches
        id: go_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}-${{ hashFiles('server/go.sum') }}

      - name: Restore golangci-lint cache
        id: golangci_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}-${{ hashFiles('server/.golangci.yml', 'server/go.sum') }}

      - name: Restore Playwright browser cache
        id: playwright_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('web/package.json') }}

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        id: playwright_install
        if: ${{ !cancelled() }}
        run: pnpm --filter web exec playwright install chromium --with-deps

      - name: Verify Music Server formatting
        id: format
        if: ${{ !cancelled() }}
        run: mise run server:format:check 2>&1 | tee "$RUNNER_TEMP/main-server-logs/go-format.log"

      - name: Lint Music Server
        id: lint
        if: ${{ !cancelled() }}
        run: mise run server:lint 2>&1 | tee "$RUNNER_TEMP/main-server-logs/golangci-lint.log"

      - name: Music Server unit tests
        id: unit
        if: ${{ !cancelled() }}
        run: mise run server:test 2>&1 | tee "$RUNNER_TEMP/main-server-logs/go-test.log"

      - name: HLS browser verification
        id: hls
        if: ${{ !cancelled() }}
        run: mise run server:test:hls 2>&1 | tee "$RUNNER_TEMP/main-server-logs/hls.log"

      - name: Build Music Server and product docs
        id: build
        if: ${{ !cancelled() }}
        run: mise run server:build 2>&1 | tee "$RUNNER_TEMP/main-server-logs/server-build.log"

      - name: Publish Go module and build caches
        if: ${{ !cancelled() && steps.go_cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}-${{ hashFiles('server/go.sum') }}

      - name: Publish golangci-lint cache
        if: ${{ !cancelled() && steps.golangci_cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}-${{ hashFiles('server/.golangci.yml', 'server/go.sum') }}

      - name: Upload Music Server production artifact
        if: ${{ always() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: main-music-server
          path: bin/server
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      - name: Upload product documentation artifact
        if: ${{ always() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: main-product-docs
          path: packages/docs/dist/
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      - name: Upload Music Server failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: main-music-server-diagnostics
          path: |
            ${{ runner.temp }}/main-server-logs/
            web/playwright-report/
            web/test-results/
          if-no-files-found: ignore
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      - name: Publish Music Server summary
        id: summary
        if: always()
        env:
          START: ${{ steps.timer.outputs.start }}
          FORMAT_OUTCOME: ${{ steps.format.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          UNIT_OUTCOME: ${{ steps.unit.outcome }}
          HLS_OUTCOME: ${{ steps.hls.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          GO_CACHE_HIT: ${{ steps.go_cache.outputs.cache-hit }}
          GOLANGCI_CACHE_HIT: ${{ steps.golangci_cache.outputs.cache-hit }}
          PLAYWRIGHT_CACHE_HIT: ${{ steps.playwright_cache.outputs.cache-hit }}
        run: |
          duration=$(( $(date +%s) - ${START:-$(date +%s)} ))
          {
            echo "### Main — Music Server, HLS, docs, and server build"
            echo
            echo "Checks: format=${FORMAT_OUTCOME:-not run}, lint=${LINT_OUTCOME:-not run}, unit=${UNIT_OUTCOME:-not run} (no retries), HLS=${HLS_OUTCOME:-not run} (one browser retry), build=${BUILD_OUTCOME:-not run}."
            echo
            echo "Caches: Go=${GO_CACHE_HIT:-miss}, golangci-lint=${GOLANGCI_CACHE_HIT:-miss}, Playwright=${PLAYWRIGHT_CACHE_HIT:-miss}."
            echo
            echo "Coverage reason: full trusted main verification; no jobs skipped by change classification."
            echo
            echo "Artifacts: \`main-music-server\`, \`main-product-docs\`; failures: \`main-music-server-diagnostics\` (14 days)."
            echo
            echo "Duration: ${duration}s"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "duration=${duration}s" >> "$GITHUB_OUTPUT"

  generated-drift:
    name: Generated client drift
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      duration: ${{ steps.summary.outputs.duration }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Record start time
        id: timer
        run: |
          echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/main-drift-logs"

      - name: Set up Mise toolchain
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          cache_save: false

      - name: Resolve pnpm store path
        id: pnpm_store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store cache
        id: pnpm_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm_store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Restore Go module and build caches
        id: go_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}-${{ hashFiles('server/go.sum') }}

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify committed OpenAPI outputs
        id: drift
        if: ${{ !cancelled() }}
        run: mise run generate:check 2>&1 | tee "$RUNNER_TEMP/main-drift-logs/generated-drift.log"

      - name: Upload generated-drift failure log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: main-generated-drift-diagnostics
          path: ${{ runner.temp }}/main-drift-logs/
          if-no-files-found: ignore
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      - name: Publish generated-drift summary
        id: summary
        if: always()
        env:
          START: ${{ steps.timer.outputs.start }}
          DRIFT_OUTCOME: ${{ steps.drift.outcome }}
          PNPM_CACHE_HIT: ${{ steps.pnpm_cache.outputs.cache-hit }}
          GO_CACHE_HIT: ${{ steps.go_cache.outputs.cache-hit }}
        run: |
          duration=$(( $(date +%s) - ${START:-$(date +%s)} ))
          {
            echo "### Main — Generated client drift"
            echo
            echo "Committed OpenAPI output check: ${DRIFT_OUTCOME:-not run}; retries: 0."
            echo
            echo "Caches: pnpm=${PNPM_CACHE_HIT:-miss}, Go=${GO_CACHE_HIT:-miss}."
            echo
            echo "No generation runs implicitly; only \`mise run generate:check\` verifies committed output."
            echo
            echo "Failure artifact: \`main-generated-drift-diagnostics\` (14 days)."
            echo
            echo "Duration: ${duration}s"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "duration=${duration}s" >> "$GITHUB_OUTPUT"

  desktop:
    name: Desktop Client, real mpv, and Desktop build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      duration: ${{ steps.summary.outputs.duration }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Record start time
        id: timer
        run: |
          echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/main-desktop-logs"

      - name: Set up Mise toolchain
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          cache_save: false

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ffmpeg \
            libayatana-appindicator3-dev \
            libass-dev \
            libavcodec-dev \
            libavfilter-dev \
            libavformat-dev \
            libavutil-dev \
            libplacebo-dev \
            librsvg2-dev \
            libssl-dev \
            libswresample-dev \
            libswscale-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            meson \
            ninja-build \
            pkg-config

      - name: Resolve pnpm store path
        id: pnpm_store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store cache
        id: pnpm_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm_store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Restore Turbo cache
        id: turbo_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}-${{ hashFiles('turbo.json') }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Record Rust toolchain version
        id: rust
        run: echo "version=$(rustc --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"

      - name: Restore Cargo caches
        id: cargo_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            desktop/src-tauri/target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.version }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}

      - name: Record pinned mpv identity
        id: mpv_meta
        run: |
          version="$(tr -d '\r\n' < desktop/src-tauri/mpv-version.txt)"
          flags_digest="$(printf '%s' "$MPV_BUILD_FLAGS" | sha256sum | cut -d ' ' -f 1 | cut -c 1-16)"
          image_fingerprint="${ImageOS:-unknown}-${ImageVersion:-unknown}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "flags_digest=${flags_digest}" >> "$GITHUB_OUTPUT"
          echo "image_fingerprint=${image_fingerprint}" >> "$GITHUB_OUTPUT"

      - name: Restore verified pinned mpv cache
        id: mpv_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/earthly-audio-mpv
          key: mpv-${{ runner.os }}-${{ runner.arch }}-${{ steps.mpv_meta.outputs.image_fingerprint }}-${{ steps.mpv_meta.outputs.version }}-${{ env.MPV_SOURCE_SHA256 }}-${{ steps.mpv_meta.outputs.flags_digest }}

      - name: Build pinned mpv from verified source
        id: mpv_build
        if: ${{ !cancelled() && steps.mpv_cache.outputs.cache-hit != 'true' }}
        run: |
          version="$(tr -d '\r\n' < desktop/src-tauri/mpv-version.txt)"
          archive="${RUNNER_TEMP}/mpv-${version}.tar.gz"
          source_directory="${RUNNER_TEMP}/mpv-${version}"
          binary_directory="${RUNNER_TEMP}/earthly-audio-mpv"
          curl --fail --location --retry 3 \
            "https://github.com/mpv-player/mpv/archive/refs/tags/v${version}.tar.gz" \
            --output "${archive}"
          echo "${MPV_SOURCE_SHA256}  ${archive}" | sha256sum --check
          tar --extract --gzip --file "${archive}" --directory "${RUNNER_TEMP}"
          meson setup "${source_directory}/build" "${source_directory}" ${MPV_BUILD_FLAGS} \
            2>&1 | tee "$RUNNER_TEMP/main-desktop-logs/mpv-build.log"
          meson compile -C "${source_directory}/build" ./mpv:executable \
            2>&1 | tee -a "$RUNNER_TEMP/main-desktop-logs/mpv-build.log"
          install -d -m 0755 "${binary_directory}"
          install -m 0755 "${source_directory}/build/mpv" "${binary_directory}/mpv"

      - name: Install JS dependencies
        if: ${{ !cancelled() }}
        run: pnpm install --frozen-lockfile

      - name: Verify Desktop Client formatting
        id: format
        if: ${{ !cancelled() }}
        run: mise run desktop:format:check 2>&1 | tee "$RUNNER_TEMP/main-desktop-logs/cargo-format.log"

      - name: Lint Desktop Client
        id: lint
        if: ${{ !cancelled() }}
        run: mise run desktop:lint 2>&1 | tee "$RUNNER_TEMP/main-desktop-logs/cargo-clippy.log"

      - name: Desktop Client unit tests
        id: unit
        if: ${{ !cancelled() }}
        run: mise run desktop:test 2>&1 | tee "$RUNNER_TEMP/main-desktop-logs/cargo-test.log"

      - name: Real pinned mpv verification
        id: mpv_test
        if: ${{ !cancelled() }}
        env:
          EARTHLY_AUDIO_MPV_PATH: ${{ runner.temp }}/earthly-audio-mpv/mpv
        run: mise run desktop:test:mpv 2>&1 | tee "$RUNNER_TEMP/main-desktop-logs/desktop-mpv.log"

      - name: Build Desktop Client production artifact
        id: build
        if: ${{ !cancelled() }}
        env:
          EARTHLY_AUDIO_MPV_PATH: ${{ runner.temp }}/earthly-audio-mpv/mpv
        run: mise run desktop:build 2>&1 | tee "$RUNNER_TEMP/main-desktop-logs/desktop-build.log"

      - name: Publish Cargo cache
        if: ${{ !cancelled() && steps.cargo_cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            desktop/src-tauri/target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.version }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}

      - name: Publish verified pinned mpv cache
        if: ${{ !cancelled() && steps.mpv_cache.outputs.cache-hit != 'true' && steps.mpv_build.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/earthly-audio-mpv
          key: mpv-${{ runner.os }}-${{ runner.arch }}-${{ steps.mpv_meta.outputs.image_fingerprint }}-${{ steps.mpv_meta.outputs.version }}-${{ env.MPV_SOURCE_SHA256 }}-${{ steps.mpv_meta.outputs.flags_digest }}

      - name: Upload Desktop Client production artifact
        if: ${{ always() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: main-desktop-client
          path: desktop/src-tauri/target/release/earthly-audio-desktop
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      - name: Upload Desktop Client failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: main-desktop-client-diagnostics
          path: ${{ runner.temp }}/main-desktop-logs/
          if-no-files-found: ignore
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      - name: Publish Desktop Client summary
        id: summary
        if: always()
        env:
          START: ${{ steps.timer.outputs.start }}
          FORMAT_OUTCOME: ${{ steps.format.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          UNIT_OUTCOME: ${{ steps.unit.outcome }}
          MPV_BUILD_OUTCOME: ${{ steps.mpv_build.outcome }}
          MPV_TEST_OUTCOME: ${{ steps.mpv_test.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          PNPM_CACHE_HIT: ${{ steps.pnpm_cache.outputs.cache-hit }}
          CARGO_CACHE_HIT: ${{ steps.cargo_cache.outputs.cache-hit }}
          MPV_CACHE_HIT: ${{ steps.mpv_cache.outputs.cache-hit }}
        run: |
          duration=$(( $(date +%s) - ${START:-$(date +%s)} ))
          {
            echo "### Main — Desktop Client, real mpv, and Desktop build"
            echo
            echo "Checks: format=${FORMAT_OUTCOME:-not run}, lint=${LINT_OUTCOME:-not run}, unit=${UNIT_OUTCOME:-not run} (no retries), mpv build=${MPV_BUILD_OUTCOME:-cache hit}, real mpv=${MPV_TEST_OUTCOME:-not run}, build=${BUILD_OUTCOME:-not run}."
            echo
            echo "Caches: pnpm=${PNPM_CACHE_HIT:-miss}, Cargo=${CARGO_CACHE_HIT:-miss}, verified mpv=${MPV_CACHE_HIT:-miss}."
            echo
            echo "Coverage reason: full trusted main verification; no jobs skipped by change classification."
            echo
            echo "Artifacts: \`main-desktop-client\`; failures: \`main-desktop-client-diagnostics\` (14 days)."
            echo
            echo "Duration: ${duration}s"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "duration=${duration}s" >> "$GITHUB_OUTPUT"

  full-verification:
    name: Main / Full Verification
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [workspace, music-server, generated-drift, desktop]
    if: always()
    steps:
      - name: Publish full verification summary
        env:
          WORKSPACE_RESULT: ${{ needs.workspace.result }}
          WORKSPACE_DURATION: ${{ needs.workspace.outputs.duration }}
          SERVER_RESULT: ${{ needs.music-server.result }}
          SERVER_DURATION: ${{ needs.music-server.outputs.duration }}
          DRIFT_RESULT: ${{ needs.generated-drift.result }}
          DRIFT_DURATION: ${{ needs.generated-drift.outputs.duration }}
          DESKTOP_RESULT: ${{ needs.desktop.result }}
          DESKTOP_DURATION: ${{ needs.desktop.outputs.duration }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          result=success
          for status in "$WORKSPACE_RESULT" "$SERVER_RESULT" "$DRIFT_RESULT" "$DESKTOP_RESULT"; do
            [[ "$status" == "success" ]] || result=failure
          done
          {
            echo "# Main / Full Verification"
            echo
            echo "Result: **$result**"
            echo
            echo "| Job | Result | Duration |"
            echo "| --- | ------ | -------- |"
            echo "| Workspace, Web E2E, Web build | $WORKSPACE_RESULT | ${WORKSPACE_DURATION:-—} |"
            echo "| Music Server, HLS, docs, server build | $SERVER_RESULT | ${SERVER_DURATION:-—} |"
            echo "| Generated client drift | $DRIFT_RESULT | ${DRIFT_DURATION:-—} |"
            echo "| Desktop Client, real mpv, Desktop build | $DESKTOP_RESULT | ${DESKTOP_DURATION:-—} |"
            echo
            echo "Music Server and Desktop Client are separate artifacts and have no coupled runtime lifecycle."
            echo
            echo "Run and artifact links: $RUN_URL"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$result" != "success" ]]; then
            echo "Main / Full Verification failed; see job summaries and 14-day diagnostics." >&2
            exit 1
          fi
