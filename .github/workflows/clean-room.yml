# Weekly cache-free verification for issue #82. Local and hosted runs share
# scripts/run-clean-room-verification.sh as their observable contract.

name: Clean Room

on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

concurrency:
  group: clean-room-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  ARTIFACT_RETENTION_DAYS: 14

jobs:
  full-verification:
    name: Clean Room / Full Verification
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Record start time
        id: timer
        run: |
          echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/clean-room-logs"
          echo "run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" > "$RUNNER_TEMP/clean-room-logs/run-metadata.txt"

      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up uncached Mise toolchain
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          cache: false

      - name: Install native verification dependencies
        run: bash scripts/install-linux-verification-dependencies.sh 2>&1 | tee "$RUNNER_TEMP/clean-room-logs/native-dependencies.log"

      - name: Build pinned mpv from verified source
        env:
          MPV_BUILD_LOG: ${{ runner.temp }}/clean-room-logs/mpv-build.log
        run: bash scripts/build-pinned-mpv.sh

      - name: Run clean-room verification
        id: verification
        env:
          EARTHLY_AUDIO_MPV_PATH: ${{ runner.temp }}/earthly-audio-mpv/mpv
        run: bash scripts/run-clean-room-verification.sh 2>&1 | tee "$RUNNER_TEMP/clean-room-logs/verification.log"

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: clean-room-diagnostics
          path: |
            ${{ runner.temp }}/clean-room-logs/
            web/playwright-report/
            web/test-results/
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      - name: Publish clean-room summary
        if: always()
        env:
          START: ${{ steps.timer.outputs.start }}
          VERIFICATION_OUTCOME: ${{ steps.verification.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          duration=$(( $(date +%s) - ${START:-$(date +%s)} ))
          {
            echo "# Clean Room / Full Verification"
            echo
            echo "Result: **${VERIFICATION_OUTCOME:-not run}**"
            echo
            echo "Frozen dependency installation, all tests, production builds, and container construction use isolated empty caches."
            echo
            echo "No dependency or task cache is restored or saved."
            echo
            echo "Failure artifact: \`clean-room-diagnostics\` (${ARTIFACT_RETENTION_DAYS} days)."
            echo
            echo "Duration: ${duration}s"
            echo
            echo "Run and artifact links: $RUN_URL"
          } >> "$GITHUB_STEP_SUMMARY"
