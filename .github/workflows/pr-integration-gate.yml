# Shadow pull-request Integration Gate (issue #79), completing the shadow
# gate design next to PR / Fast Gate. The conservative change classifier
# starts the agreed Web E2E, HLS, Desktop unit, and real pinned-mpv jobs
# without semantic narrowing, and one aggregator reports the gate result,
# including an explicit success when integration is unnecessary.
#
# Fast Gate and Integration Gate run in parallel: this workflow triggers on
# its own pull_request event and never waits for Fast Gate success.
#
# Every check command is a public Mise task from mise.toml. Pull requests
# restore caches but never publish them; the separate Main workflow owns
# trusted cache publication. `mise run ci:act:smoke` offers a
# thin, optional way to debug selected jobs locally (see
# docs/testing/act-smoke.md); it is neither authoritative nor required.

name: PR

on:
  pull_request:

# Cancel superseded pull-request revisions. Main verification uses its own
# workflow and concurrency policy.
concurrency:
  group: pr-integration-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  MPV_CACHE_SCHEMA: v2
  # Official signed v0.41.0 tag, commit 41f6a645068483470267271e1d09966ca3b9f413.
  # Must stay identical to the digest used by the required `lint-test` job in
  # ci.yml; the verified pinned-mpv cache key incorporates it.
  MPV_SOURCE_SHA256: ee21092a5ee427353392360929dc64645c54479aefdb5babc5cfbb5fad626209
  # Must stay identical to the meson configuration in ci.yml. The verified
  # pinned-mpv cache key incorporates a digest of these flags.
  MPV_BUILD_FLAGS: "--buildtype=release --auto-features=disabled -Dbuild-date=false -Dgl=disabled -Dlibmpv=false"

jobs:
  classify:
    name: Classify changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      web_e2e: ${{ steps.classify.outputs.web_e2e }}
      hls: ${{ steps.classify.outputs.hls }}
      desktop_unit: ${{ steps.classify.outputs.desktop_unit }}
      real_mpv: ${{ steps.classify.outputs.real_mpv }}
      integration_required: ${{ steps.classify.outputs.integration_required }}
      reasons: ${{ steps.classify.outputs.reasons }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The classifier diffs the pull-request base against the merge commit.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Mise toolchain
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          cache_save: false

      # Conditional validation depends on the classifier, so its own fixture
      # suite must pass before its outputs are trusted.
      - name: Test pull-request change classifier
        run: mise run classifier:test

      - name: Classify pull-request changes
        id: classify
        run: |
          node scripts/classify-pr-changes.mjs \
            --base '${{ github.event.pull_request.base.sha }}' \
            --head '${{ github.sha }}' \
            --format github >> "$GITHUB_OUTPUT"

  web-e2e:
    name: Web E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [classify]
    # Classifier output maps one-to-one onto this job.
    if: always() && needs.classify.result == 'success' && needs.classify.outputs.web_e2e == 'true'
    outputs:
      duration: ${{ steps.summary.outputs.duration }}
      test_outcome: ${{ steps.test.outcome }}
      cache_pnpm_hit: ${{ steps.pnpm_cache.outputs.cache-hit }}
      cache_pnpm_key: ${{ steps.pnpm_cache.outputs.cache-matched-key }}
      cache_go_hit: ${{ steps.go_cache.outputs.cache-hit }}
      cache_go_key: ${{ steps.go_cache.outputs.cache-matched-key }}
      cache_playwright_hit: ${{ steps.playwright_cache.outputs.cache-hit }}
      cache_playwright_key: ${{ steps.playwright_cache.outputs.cache-matched-key }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Record start time
        id: timer
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Set up Mise toolchain
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          # Pull requests must not publish caches.
          cache_save: false

      - name: Resolve pnpm store path
        id: pnpm_store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store cache
        id: pnpm_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm_store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}-${{ hashFiles('pnpm-lock.yaml') }}

      # Playwright starts the API with `go run`. Without this restore the first
      # compile hits proxy.golang.org and a single stream error kills the job.
      - name: Restore Go module and build caches
        id: go_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}-${{ hashFiles('server/go.sum') }}

      # Browsers are derived from committed lockfile inputs only, so the key
      # cannot be steered by pull-request contents; the separate Main workflow
      # publishes the trusted entry.
      - name: Restore Playwright browser cache
        id: playwright_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('web/package.json') }}

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Go modules
        working-directory: server
        run: |
          attempt=1
          until go mod download; do
            if (( attempt >= 3 )); then
              exit 1
            fi
            sleep $(( attempt * 2 ))
            attempt=$((attempt + 1))
          done

      - name: Install Playwright Chromium
        run: pnpm --filter web exec playwright install chromium --with-deps

      - name: Web E2E tests
        id: test
        run: |
          mkdir -p "$RUNNER_TEMP/integration-gate-logs"
          mise run web:test:e2e 2>&1 | tee "$RUNNER_TEMP/integration-gate-logs/web-e2e.log"

      - name: Publish job summary
        id: summary
        if: always()
        env:
          START: ${{ steps.timer.outputs.start }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          PNPM_CACHE_HIT: ${{ steps.pnpm_cache.outputs.cache-hit }}
          PNPM_CACHE_KEY: ${{ steps.pnpm_cache.outputs.cache-matched-key }}
          GO_CACHE_HIT: ${{ steps.go_cache.outputs.cache-hit }}
          GO_CACHE_KEY: ${{ steps.go_cache.outputs.cache-matched-key }}
          PLAYWRIGHT_CACHE_HIT: ${{ steps.playwright_cache.outputs.cache-hit }}
          PLAYWRIGHT_CACHE_KEY: ${{ steps.playwright_cache.outputs.cache-matched-key }}
        run: |
          duration=$(( $(date +%s) - START ))
          cache_status() {
            if [[ "$1" == "true" ]]; then echo "hit"
            elif [[ -n "$2" ]]; then echo "hit (partial)"
            else echo "miss"
            fi
          }
          {
            echo "### PR / Integration Gate — Web E2E"
            echo
            echo "| Check | Result |"
            echo "| ----- | ------ |"
            echo "| Playwright E2E and production smoke | ${TEST_OUTCOME:-not run} |"
            echo
            echo "| Cache | Status |"
            echo "| ----- | ------ |"
            echo "| pnpm store | $(cache_status "$PNPM_CACHE_HIT" "$PNPM_CACHE_KEY") |"
            echo "| Go modules | $(cache_status "$GO_CACHE_HIT" "$GO_CACHE_KEY") |"
            echo "| Playwright browsers | $(cache_status "$PLAYWRIGHT_CACHE_HIT" "$PLAYWRIGHT_CACHE_KEY") |"
            echo
            echo "Duration: ${duration}s"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "duration=${duration}s" >> "$GITHUB_OUTPUT"

      # Browser diagnostics only: report, traces, screenshots, and retry
      # data. Logs contain command output only, never environment dumps.
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: integration-gate-web-e2e-diagnostics
          path: |
            web/playwright-report/
            web/test-results/
            ${{ runner.temp }}/integration-gate-logs/
          if-no-files-found: ignore
          retention-days: 7

  hls:
    name: Music Server HLS
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [classify]
    if: always() && needs.classify.result == 'success' && needs.classify.outputs.hls == 'true'
    outputs:
      duration: ${{ steps.summary.outputs.duration }}
      test_outcome: ${{ steps.test.outcome }}
      cache_pnpm_hit: ${{ steps.pnpm_cache.outputs.cache-hit }}
      cache_pnpm_key: ${{ steps.pnpm_cache.outputs.cache-matched-key }}
      cache_go_hit: ${{ steps.go_cache.outputs.cache-hit }}
      cache_go_key: ${{ steps.go_cache.outputs.cache-matched-key }}
      cache_playwright_hit: ${{ steps.playwright_cache.outputs.cache-hit }}
      cache_playwright_key: ${{ steps.playwright_cache.outputs.cache-matched-key }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Record start time
        id: timer
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Set up Mise toolchain
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          cache_save: false

      - name: Resolve pnpm store path
        id: pnpm_store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store cache
        id: pnpm_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm_store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Restore Go module and build caches
        id: go_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}-${{ hashFiles('server/go.sum') }}

      - name: Restore Playwright browser cache
        id: playwright_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('web/package.json') }}

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter web exec playwright install chromium --with-deps

      # The Music Server task drives Playwright against the proxy itself;
      # its verbose output includes the browser run.
      - name: HLS browser integration
        id: test
        run: |
          mkdir -p "$RUNNER_TEMP/integration-gate-logs"
          mise run server:test:hls 2>&1 | tee "$RUNNER_TEMP/integration-gate-logs/hls-integration.log"

      - name: Publish job summary
        id: summary
        if: always()
        env:
          START: ${{ steps.timer.outputs.start }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          PNPM_CACHE_HIT: ${{ steps.pnpm_cache.outputs.cache-hit }}
          PNPM_CACHE_KEY: ${{ steps.pnpm_cache.outputs.cache-matched-key }}
          GO_CACHE_HIT: ${{ steps.go_cache.outputs.cache-hit }}
          GO_CACHE_KEY: ${{ steps.go_cache.outputs.cache-matched-key }}
          PLAYWRIGHT_CACHE_HIT: ${{ steps.playwright_cache.outputs.cache-hit }}
          PLAYWRIGHT_CACHE_KEY: ${{ steps.playwright_cache.outputs.cache-matched-key }}
        run: |
          duration=$(( $(date +%s) - START ))
          cache_status() {
            if [[ "$1" == "true" ]]; then echo "hit"
            elif [[ -n "$2" ]]; then echo "hit (partial)"
            else echo "miss"
            fi
          }
          {
            echo "### PR / Integration Gate — Music Server HLS"
            echo
            echo "| Check | Result |"
            echo "| ----- | ------ |"
            echo "| HLS proxy browser integration | ${TEST_OUTCOME:-not run} |"
            echo
            echo "| Cache | Status |"
            echo "| ----- | ------ |"
            echo "| pnpm store | $(cache_status "$PNPM_CACHE_HIT" "$PNPM_CACHE_KEY") |"
            echo "| Go modules and build | $(cache_status "$GO_CACHE_HIT" "$GO_CACHE_KEY") |"
            echo "| Playwright browsers | $(cache_status "$PLAYWRIGHT_CACHE_HIT" "$PLAYWRIGHT_CACHE_KEY") |"
            echo
            echo "Duration: ${duration}s"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "duration=${duration}s" >> "$GITHUB_OUTPUT"

      # Native integration log, kept longer than browser diagnostics. Logs
      # contain command output only, never environment dumps.
      - name: Upload HLS integration log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: integration-gate-hls-logs
          path: ${{ runner.temp }}/integration-gate-logs/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload HLS browser diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: integration-gate-hls-browser-diagnostics
          path: |
            web/playwright-report/
            web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  desktop-unit:
    name: Desktop unit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [classify]
    if: always() && needs.classify.result == 'success' && needs.classify.outputs.desktop_unit == 'true'
    outputs:
      duration: ${{ steps.summary.outputs.duration }}
      test_outcome: ${{ steps.test.outcome }}
      cache_pnpm_hit: ${{ steps.pnpm_cache.outputs.cache-hit }}
      cache_pnpm_key: ${{ steps.pnpm_cache.outputs.cache-matched-key }}
      cache_cargo_hit: ${{ steps.cargo_cache.outputs.cache-hit }}
      cache_cargo_key: ${{ steps.cargo_cache.outputs.cache-matched-key }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Record start time
        id: timer
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Set up Mise toolchain
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          cache_save: false

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ffmpeg \
            libayatana-appindicator3-dev \
            libass-dev \
            libavcodec-dev \
            libavfilter-dev \
            libavformat-dev \
            libavutil-dev \
            libplacebo-dev \
            librsvg2-dev \
            libssl-dev \
            libswresample-dev \
            libswscale-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            meson \
            ninja-build \
            pkg-config

      - name: Resolve pnpm store path
        id: pnpm_store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store cache
        id: pnpm_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm_store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Record Rust toolchain version
        id: rust
        run: echo "version=$(rustc --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"

      - name: Restore Cargo caches
        id: cargo_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            desktop/src-tauri/target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.version }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Desktop Client unit tests
        id: test
        run: |
          mkdir -p "$RUNNER_TEMP/integration-gate-logs"
          mise run desktop:test 2>&1 | tee "$RUNNER_TEMP/integration-gate-logs/desktop-unit.log"

      - name: Publish job summary
        id: summary
        if: always()
        env:
          START: ${{ steps.timer.outputs.start }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          PNPM_CACHE_HIT: ${{ steps.pnpm_cache.outputs.cache-hit }}
          PNPM_CACHE_KEY: ${{ steps.pnpm_cache.outputs.cache-matched-key }}
          CARGO_CACHE_HIT: ${{ steps.cargo_cache.outputs.cache-hit }}
          CARGO_CACHE_KEY: ${{ steps.cargo_cache.outputs.cache-matched-key }}
        run: |
          duration=$(( $(date +%s) - START ))
          cache_status() {
            if [[ "$1" == "true" ]]; then echo "hit"
            elif [[ -n "$2" ]]; then echo "hit (partial)"
            else echo "miss"
            fi
          }
          {
            echo "### PR / Integration Gate — Desktop unit"
            echo
            echo "| Check | Result |"
            echo "| ----- | ------ |"
            echo "| Desktop Client unit tests | ${TEST_OUTCOME:-not run} |"
            echo
            echo "| Cache | Status |"
            echo "| ----- | ------ |"
            echo "| pnpm store | $(cache_status "$PNPM_CACHE_HIT" "$PNPM_CACHE_KEY") |"
            echo "| Cargo | $(cache_status "$CARGO_CACHE_HIT" "$CARGO_CACHE_KEY") |"
            echo
            echo "Duration: ${duration}s"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "duration=${duration}s" >> "$GITHUB_OUTPUT"

      # Native integration log. Logs contain command output only, never
      # environment dumps.
      - name: Upload Desktop unit log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: integration-gate-desktop-unit-logs
          path: ${{ runner.temp }}/integration-gate-logs/
          if-no-files-found: ignore
          retention-days: 14

  real-mpv:
    name: Real pinned mpv
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [classify]
    if: always() && needs.classify.result == 'success' && needs.classify.outputs.real_mpv == 'true'
    outputs:
      duration: ${{ steps.summary.outputs.duration }}
      test_outcome: ${{ steps.test.outcome }}
      build_outcome: ${{ steps.mpv_build.outcome }}
      cache_pnpm_hit: ${{ steps.pnpm_cache.outputs.cache-hit }}
      cache_pnpm_key: ${{ steps.pnpm_cache.outputs.cache-matched-key }}
      cache_cargo_hit: ${{ steps.cargo_cache.outputs.cache-hit }}
      cache_cargo_key: ${{ steps.cargo_cache.outputs.cache-matched-key }}
      cache_mpv_hit: ${{ steps.mpv_cache.outputs.cache-hit }}
      cache_mpv_key: ${{ steps.mpv_cache.outputs.cache-matched-key }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Record start time
        id: timer
        run: |
          echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/integration-gate-logs"

      - name: Set up Mise toolchain
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          cache_save: false

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ffmpeg \
            libayatana-appindicator3-dev \
            libass-dev \
            libavcodec-dev \
            libavfilter-dev \
            libavformat-dev \
            libavutil-dev \
            libplacebo-dev \
            librsvg2-dev \
            libssl-dev \
            libswresample-dev \
            libswscale-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            meson \
            ninja-build \
            pkg-config

      # The cache key carries the pinned version, the verified source digest,
      # the build flags, the operating system, the architecture, and the
      # runner image fingerprint, so a binary can only be restored from the
      # exact verified provenance of a compatible runner image.
      - name: Record pinned mpv identity
        id: mpv_meta
        run: |
          version="$(tr -d '\r\n' < desktop/src-tauri/mpv-version.txt)"
          flags_digest="$(printf '%s' "$MPV_BUILD_FLAGS" | sha256sum | cut -d ' ' -f 1 | cut -c 1-16)"
          # mpv is dynamically linked against system packages; the image
          # fingerprint keeps a cached binary from outliving an image ABI change.
          image_fingerprint="${ImageOS:-unknown}-${ImageVersion:-unknown}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "flags_digest=${flags_digest}" >> "$GITHUB_OUTPUT"
          echo "image_fingerprint=${image_fingerprint}" >> "$GITHUB_OUTPUT"

      - name: Resolve pnpm store path
        id: pnpm_store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store cache
        id: pnpm_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm_store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Record Rust toolchain version
        id: rust
        run: echo "version=$(rustc --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"

      - name: Restore Cargo caches
        id: cargo_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            desktop/src-tauri/target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.version }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}

      - name: Restore verified pinned mpv cache
        id: mpv_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/earthly-audio-mpv
          key: mpv-${{ env.MPV_CACHE_SCHEMA }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.mpv_meta.outputs.image_fingerprint }}-${{ steps.mpv_meta.outputs.version }}-${{ env.MPV_SOURCE_SHA256 }}-${{ steps.mpv_meta.outputs.flags_digest }}

      - name: Build pinned mpv from verified source
        id: mpv_build
        if: steps.mpv_cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/integration-gate-logs"
          PINNED_MPV_VERSION="$(tr -d '\r\n' < desktop/src-tauri/mpv-version.txt)"
          MPV_ARCHIVE="${RUNNER_TEMP}/mpv-${PINNED_MPV_VERSION}.tar.gz"
          MPV_SOURCE_DIRECTORY="${RUNNER_TEMP}/mpv-${PINNED_MPV_VERSION}"
          MPV_BINARY_DIRECTORY="${RUNNER_TEMP}/earthly-audio-mpv"
          curl --fail --location --retry 3 \
            "https://github.com/mpv-player/mpv/archive/refs/tags/v${PINNED_MPV_VERSION}.tar.gz" \
            --output "${MPV_ARCHIVE}"
          echo "${MPV_SOURCE_SHA256}  ${MPV_ARCHIVE}" | sha256sum --check
          tar --extract --gzip --file "${MPV_ARCHIVE}" --directory "${RUNNER_TEMP}"
          meson setup "${MPV_SOURCE_DIRECTORY}/build" "${MPV_SOURCE_DIRECTORY}" ${MPV_BUILD_FLAGS} \
            2>&1 | tee "$RUNNER_TEMP/integration-gate-logs/mpv-meson-setup.log"
          meson compile -C "${MPV_SOURCE_DIRECTORY}/build" ./mpv:executable \
            2>&1 | tee -a "$RUNNER_TEMP/integration-gate-logs/mpv-meson-setup.log"
          install -d -m 0755 "${MPV_BINARY_DIRECTORY}"
          install -m 0755 "${MPV_SOURCE_DIRECTORY}/build/mpv" "${MPV_BINARY_DIRECTORY}/mpv"
          (cd "${MPV_BINARY_DIRECTORY}" && sha256sum mpv > mpv.sha256)

      - name: Verify pinned mpv cache integrity
        if: ${{ !cancelled() && (steps.mpv_cache.outputs.cache-hit == 'true' || steps.mpv_build.outcome == 'success') }}
        run: (cd "$RUNNER_TEMP/earthly-audio-mpv" && sha256sum --check mpv.sha256)

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # Stages the verified binary as the sidecar and runs the Desktop
      # Client tests against real pinned mpv.
      - name: Real pinned mpv integration
        id: test
        env:
          EARTHLY_AUDIO_MPV_PATH: ${{ runner.temp }}/earthly-audio-mpv/mpv
        run: |
          mise run desktop:test:mpv 2>&1 | tee "$RUNNER_TEMP/integration-gate-logs/desktop-mpv.log"

      # Real Managed Imports for every supported format through the native
      # transport against a Music Server built from this checkout (issue #55).
      - name: Desktop Managed Import parity against a real Music Server
        id: import_parity
        if: ${{ !cancelled() }}
        run: |
          mise run desktop:test:import-parity 2>&1 | tee "$RUNNER_TEMP/integration-gate-logs/desktop-import-parity.log"

      - name: Publish job summary
        id: summary
        if: always()
        env:
          START: ${{ steps.timer.outputs.start }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          IMPORT_PARITY_OUTCOME: ${{ steps.import_parity.outcome }}
          PNPM_CACHE_HIT: ${{ steps.pnpm_cache.outputs.cache-hit }}
          PNPM_CACHE_KEY: ${{ steps.pnpm_cache.outputs.cache-matched-key }}
          CARGO_CACHE_HIT: ${{ steps.cargo_cache.outputs.cache-hit }}
          CARGO_CACHE_KEY: ${{ steps.cargo_cache.outputs.cache-matched-key }}
          MPV_CACHE_HIT: ${{ steps.mpv_cache.outputs.cache-hit }}
          MPV_CACHE_KEY: ${{ steps.mpv_cache.outputs.cache-matched-key }}
        run: |
          duration=$(( $(date +%s) - START ))
          cache_status() {
            if [[ "$1" == "true" ]]; then echo "hit"
            elif [[ -n "$2" ]]; then echo "hit (partial)"
            else echo "miss"
            fi
          }
          {
            echo "### PR / Integration Gate — Real pinned mpv"
            echo
            echo "| Check | Result |"
            echo "| ----- | ------ |"
            echo "| Desktop Client tests against real pinned mpv | ${TEST_OUTCOME:-not run} |"
            echo "| Desktop Managed Import parity against a real Music Server | ${IMPORT_PARITY_OUTCOME:-not run} |"
            echo
            echo "| Cache | Status |"
            echo "| ----- | ------ |"
            echo "| pnpm store | $(cache_status "$PNPM_CACHE_HIT" "$PNPM_CACHE_KEY") |"
            echo "| Cargo | $(cache_status "$CARGO_CACHE_HIT" "$CARGO_CACHE_KEY") |"
            echo "| Verified pinned mpv | $(cache_status "$MPV_CACHE_HIT" "$MPV_CACHE_KEY") |"
            echo
            echo "Duration: ${duration}s"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "duration=${duration}s" >> "$GITHUB_OUTPUT"

      # Native integration logs, kept longer than browser diagnostics. Logs
      # contain command output only, never environment dumps.
      - name: Upload real mpv integration logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: integration-gate-real-mpv-logs
          path: ${{ runner.temp }}/integration-gate-logs/
          if-no-files-found: ignore
          retention-days: 14

  integration-gate:
    name: PR / Integration Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [classify, web-e2e, hls, desktop-unit, real-mpv]
    if: always()
    outputs:
      result: ${{ steps.result.outputs.result }}
    steps:
      - name: Evaluate gate result
        id: result
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          WEB_E2E_RESULT: ${{ needs.web-e2e.result }}
          HLS_RESULT: ${{ needs.hls.result }}
          DESKTOP_UNIT_RESULT: ${{ needs.desktop-unit.result }}
          REAL_MPV_RESULT: ${{ needs.real-mpv.result }}
        run: |
          # Classification must succeed; conditional jobs may be skipped when
          # the classifier did not select them.
          result=success
          if [[ "$CLASSIFY_RESULT" != "success" ]]; then
            result=failure
          fi
          for status in "$WEB_E2E_RESULT" "$HLS_RESULT" "$DESKTOP_UNIT_RESULT" "$REAL_MPV_RESULT"; do
            if [[ "$status" != "success" && "$status" != "skipped" ]]; then
              result=failure
            fi
          done
          echo "result=$result" >> "$GITHUB_OUTPUT"

      - name: Publish gate summary
        if: always()
        env:
          RESULT: ${{ steps.result.outputs.result }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          WEB_E2E_FLAG: ${{ needs.classify.outputs.web_e2e }}
          HLS_FLAG: ${{ needs.classify.outputs.hls }}
          DESKTOP_UNIT_FLAG: ${{ needs.classify.outputs.desktop_unit }}
          REAL_MPV_FLAG: ${{ needs.classify.outputs.real_mpv }}
          INTEGRATION_REQUIRED: ${{ needs.classify.outputs.integration_required }}
          REASONS: ${{ needs.classify.outputs.reasons }}
          WEB_E2E_RESULT: ${{ needs.web-e2e.result }}
          WEB_E2E_DURATION: ${{ needs.web-e2e.outputs.duration }}
          WEB_E2E_PNPM_HIT: ${{ needs.web-e2e.outputs.cache_pnpm_hit }}
          WEB_E2E_PNPM_KEY: ${{ needs.web-e2e.outputs.cache_pnpm_key }}
          WEB_E2E_PLAYWRIGHT_HIT: ${{ needs.web-e2e.outputs.cache_playwright_hit }}
          WEB_E2E_PLAYWRIGHT_KEY: ${{ needs.web-e2e.outputs.cache_playwright_key }}
          HLS_RESULT: ${{ needs.hls.result }}
          HLS_DURATION: ${{ needs.hls.outputs.duration }}
          HLS_PNPM_HIT: ${{ needs.hls.outputs.cache_pnpm_hit }}
          HLS_PNPM_KEY: ${{ needs.hls.outputs.cache_pnpm_key }}
          HLS_GO_HIT: ${{ needs.hls.outputs.cache_go_hit }}
          HLS_GO_KEY: ${{ needs.hls.outputs.cache_go_key }}
          HLS_PLAYWRIGHT_HIT: ${{ needs.hls.outputs.cache_playwright_hit }}
          HLS_PLAYWRIGHT_KEY: ${{ needs.hls.outputs.cache_playwright_key }}
          DESKTOP_UNIT_RESULT: ${{ needs.desktop-unit.result }}
          DESKTOP_UNIT_DURATION: ${{ needs.desktop-unit.outputs.duration }}
          DESKTOP_UNIT_PNPM_HIT: ${{ needs.desktop-unit.outputs.cache_pnpm_hit }}
          DESKTOP_UNIT_PNPM_KEY: ${{ needs.desktop-unit.outputs.cache_pnpm_key }}
          DESKTOP_UNIT_CARGO_HIT: ${{ needs.desktop-unit.outputs.cache_cargo_hit }}
          DESKTOP_UNIT_CARGO_KEY: ${{ needs.desktop-unit.outputs.cache_cargo_key }}
          REAL_MPV_RESULT: ${{ needs.real-mpv.result }}
          REAL_MPV_DURATION: ${{ needs.real-mpv.outputs.duration }}
          WEB_E2E_TEST_OUTCOME: ${{ needs.web-e2e.outputs.test_outcome }}
          HLS_TEST_OUTCOME: ${{ needs.hls.outputs.test_outcome }}
          DESKTOP_UNIT_TEST_OUTCOME: ${{ needs.desktop-unit.outputs.test_outcome }}
          REAL_MPV_TEST_OUTCOME: ${{ needs.real-mpv.outputs.test_outcome }}
          REAL_MPV_BUILD_OUTCOME: ${{ needs.real-mpv.outputs.build_outcome }}
          REAL_MPV_PNPM_HIT: ${{ needs.real-mpv.outputs.cache_pnpm_hit }}
          REAL_MPV_PNPM_KEY: ${{ needs.real-mpv.outputs.cache_pnpm_key }}
          REAL_MPV_CARGO_HIT: ${{ needs.real-mpv.outputs.cache_cargo_hit }}
          REAL_MPV_CARGO_KEY: ${{ needs.real-mpv.outputs.cache_cargo_key }}
          REAL_MPV_CACHE_HIT: ${{ needs.real-mpv.outputs.cache_mpv_hit }}
          REAL_MPV_CACHE_KEY: ${{ needs.real-mpv.outputs.cache_mpv_key }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cache_status() {
            if [[ "$1" == "true" ]]; then echo "hit"
            elif [[ -n "$2" ]]; then echo "hit (partial)"
            else echo "miss"
            fi
          }
          # A job that did not run reports no cache status at all.
          cache_cell() {
            if [[ -z "$1" ]]; then
              echo "—"
              return
            fi
            shift
            local out=""
            local spec
            for spec in "$@"; do
              local name="${spec%%|*}"
              local hit="${spec#*|}"
              hit="${hit%%|*}"
              local key="${spec##*|}"
              [[ -n "$out" ]] && out+=", "
              out+="$name $(cache_status "$hit" "$key")"
            done
            echo "$out"
          }
          web_e2e_caches="$(cache_cell "$WEB_E2E_DURATION" \
            "pnpm|$WEB_E2E_PNPM_HIT|$WEB_E2E_PNPM_KEY" \
            "playwright|$WEB_E2E_PLAYWRIGHT_HIT|$WEB_E2E_PLAYWRIGHT_KEY")"
          hls_caches="$(cache_cell "$HLS_DURATION" \
            "pnpm|$HLS_PNPM_HIT|$HLS_PNPM_KEY" \
            "go|$HLS_GO_HIT|$HLS_GO_KEY" \
            "playwright|$HLS_PLAYWRIGHT_HIT|$HLS_PLAYWRIGHT_KEY")"
          desktop_unit_caches="$(cache_cell "$DESKTOP_UNIT_DURATION" \
            "pnpm|$DESKTOP_UNIT_PNPM_HIT|$DESKTOP_UNIT_PNPM_KEY" \
            "cargo|$DESKTOP_UNIT_CARGO_HIT|$DESKTOP_UNIT_CARGO_KEY")"
          real_mpv_caches="$(cache_cell "$REAL_MPV_DURATION" \
            "pnpm|$REAL_MPV_PNPM_HIT|$REAL_MPV_PNPM_KEY" \
            "cargo|$REAL_MPV_CARGO_HIT|$REAL_MPV_CARGO_KEY" \
            "mpv (verified)|$REAL_MPV_CACHE_HIT|$REAL_MPV_CACHE_KEY")"
          {
            echo "# PR / Integration Gate (shadow)"
            echo
            echo "Result: **$RESULT**"
            echo
            echo "Run kind: pull-request shadow run"
            echo
            echo "| Job | Result | Duration | Caches |"
            echo "| --- | ------ | -------- | ------ |"
            echo "| Classify changes | $CLASSIFY_RESULT | — | — |"
            echo "| Web E2E | $WEB_E2E_RESULT | ${WEB_E2E_DURATION:-—} | $web_e2e_caches |"
            echo "| Music Server HLS | $HLS_RESULT | ${HLS_DURATION:-—} | $hls_caches |"
            echo "| Desktop unit | $DESKTOP_UNIT_RESULT | ${DESKTOP_UNIT_DURATION:-—} | $desktop_unit_caches |"
            echo "| Real pinned mpv | $REAL_MPV_RESULT | ${REAL_MPV_DURATION:-—} | $real_mpv_caches |"
            echo
            echo "## Classifier decision"
            echo
            echo "| Decision | Value |"
            echo "| -------- | ----- |"
            echo "| web_e2e | ${WEB_E2E_FLAG:-unknown} |"
            echo "| hls | ${HLS_FLAG:-unknown} |"
            echo "| desktop_unit | ${DESKTOP_UNIT_FLAG:-unknown} |"
            echo "| real_mpv | ${REAL_MPV_FLAG:-unknown} |"
            echo "| integration_required | ${INTEGRATION_REQUIRED:-unknown} |"
            echo "| Reasons | ${REASONS:-unknown} |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$RESULT" == "success" && "$INTEGRATION_REQUIRED" != "true" ]]; then
            {
              echo
              echo "## No integration required"
              echo
              echo "The classifier selected no integration coverage for this change"
              echo "(reasons: ${REASONS:-unknown}); the gate reports explicit success"
              echo "without running integration jobs."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ "$RESULT" != "success" ]]; then
            # Advertise only diagnostics whose producing step ran and failed;
            # a job that failed during setup has no artifacts at all.
            log_artifacts=""
            if [[ "$HLS_TEST_OUTCOME" == "failure" ]]; then
              log_artifacts+="- \`integration-gate-hls-logs\` (native log, 14 days)"$'\n'
              log_artifacts+="- \`integration-gate-hls-browser-diagnostics\` (browser report, traces, screenshots, 7 days)"$'\n'
            fi
            if [[ "$WEB_E2E_TEST_OUTCOME" == "failure" ]]; then
              log_artifacts+="- \`integration-gate-web-e2e-diagnostics\` (browser report, traces, screenshots, retry data, 7 days)"$'\n'
            fi
            if [[ "$DESKTOP_UNIT_TEST_OUTCOME" == "failure" ]]; then
              log_artifacts+="- \`integration-gate-desktop-unit-logs\` (native log, 14 days)"$'\n'
            fi
            if [[ "$REAL_MPV_TEST_OUTCOME" == "failure" || "$REAL_MPV_BUILD_OUTCOME" == "failure" ]]; then
              log_artifacts+="- \`integration-gate-real-mpv-logs\` (native logs, 14 days)"$'\n'
            fi
            {
              echo
              echo "## Failure diagnostics"
              echo
              if [[ -n "$log_artifacts" ]]; then
                echo "Diagnostics are attached to this run:"
                echo
                printf '%s' "$log_artifacts"
                echo
                echo "Run: $RUN_URL"
              else
                echo "No diagnostics apply to this failure; see the failed job's step output: $RUN_URL"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Enforce gate result
        if: steps.result.outputs.result == 'failure'
        run: |
          echo "PR / Integration Gate failed; see the gate summary for diagnostics." >&2
          exit 1
