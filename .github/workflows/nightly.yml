# Complete nightly production verification (issue #81).
#
# Reuse trusted Main verification so scheduled and manual runs exercise identical
# public tasks, cache policy, diagnostics, and separate production artifacts.
# Build container independently because it is an additional production artifact.

name: Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-production-verification-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  ARTIFACT_RETENTION_DAYS: 14

jobs:
  record-start:
    name: Record nightly start
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      started-at: ${{ steps.timer.outputs.started-at }}
    steps:
      - name: Record start time
        id: timer
        run: echo "started-at=$(date +%s)" >> "$GITHUB_OUTPUT"

  full-production-verification:
    name: Full production verification
    needs: record-start
    uses: ./.github/workflows/main.yml

  container:
    name: Container production artifact
    needs: record-start
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build container production artifact
        id: build
        run: |
          mkdir -p "$RUNNER_TEMP/nightly-container-logs"
          docker build --tag navidrome-replacement:nightly --file Dockerfile . \
            2>&1 | tee "$RUNNER_TEMP/nightly-container-logs/docker-build.log"

      - name: Export container production artifact
        id: export
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: docker save --output "$RUNNER_TEMP/nightly-container.tar" navidrome-replacement:nightly

      - name: Upload container production artifact
        if: ${{ always() && steps.export.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-container
          path: ${{ runner.temp }}/nightly-container.tar
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      - name: Upload container failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-container-diagnostics
          path: ${{ runner.temp }}/nightly-container-logs/
          if-no-files-found: ignore
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  nightly-verification:
    name: Nightly / Full Verification
    needs: [record-start, full-production-verification, container]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Publish nightly verification summary
        env:
          STARTED_AT: ${{ needs.record-start.outputs.started-at }}
          FULL_RESULT: ${{ needs.full-production-verification.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          duration=$(( $(date +%s) - ${STARTED_AT:-$(date +%s)} ))
          result=success
          [[ "$FULL_RESULT" == "success" && "$CONTAINER_RESULT" == "success" ]] || result=failure
          {
            echo "# Nightly / Full Verification"
            echo
            echo "Result: **$result**"
            echo
            echo "| Job | Result |"
            echo "| --- | ------ |"
            echo "| Workspace, Music Server, Desktop Client, browser, HLS, real mpv, and production builds | $FULL_RESULT |"
            echo "| Container production artifact | $CONTAINER_RESULT |"
            echo
            echo "Cache status: trusted hit/miss details are exposed by the full production verification job summaries."
            echo
            echo "Retry count: Web E2E and HLS counts are exposed by their job summaries; all unit, real mpv, and container tasks use zero retries."
            echo
            echo "Artifacts: Web Client, product docs, Music Server, Desktop Client, and `nightly-container`; diagnostics retained ${ARTIFACT_RETENTION_DAYS} days."
            echo
            echo "Duration: ${duration}s"
            echo
            echo "Run and artifact links: $RUN_URL"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$result" != "success" ]]; then
            echo "Nightly / Full Verification failed; see job summaries and ${ARTIFACT_RETENTION_DAYS}-day diagnostics." >&2
            exit 1
          fi
